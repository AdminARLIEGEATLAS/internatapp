<!DOCTYPE html>
<html lang="fr">
<head>
<script>
  // Created first, synchronously, so it exists no matter when the Firebase
  // module script below finishes loading. boot() waits on this before
  // touching any data, so there's no race between the two.
  window.__firebaseReady = new Promise((resolve)=>{ window.__firebaseReadyResolve = resolve; });
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internat — AR Liège Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D6402C; --red-dark:#AD2E1E; --red-light:#FBE4E0; --red-glow:rgba(214,64,44,.35);
  --blue:#33509A; --blue-dark:#1A2E5C; --blue-light:#E4E9F5; --blue-mid:#2B4483;
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#1C2230; --muted:#687080;
  --line:#DFE3ED; --line-strong:#C7CDDC;
  --green:#1E8E5A; --green-light:#E1F5EB;
  --amber:#C77F1A; --amber-light:#FBF0DE;
  --violet:#8144A8; --violet-light:#F1E5F7;
  --gray:#8992A3; --gray-light:#EEF0F4;
  --radius:14px;
  --shadow:0 1px 2px rgba(28,34,48,.05), 0 8px 24px rgba(28,34,48,.06);
  --shadow-lift:0 10px 30px rgba(28,34,48,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(51,80,154,.06), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(214,64,44,.05), transparent 40%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.2px; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex; min-height:100vh;}
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ---- Sidebar ---- */
.sidebar{
  width:238px; flex:0 0 238px; color:#fff;
  background:linear-gradient(190deg, var(--blue-mid) 0%, var(--blue-dark) 65%);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  box-shadow:4px 0 24px rgba(10,16,36,.18); z-index:2;
}
.brand{padding:22px 18px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,.14); position:relative;}
.brand::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:linear-gradient(90deg, var(--red), transparent 80%);}
.brand-mark{width:52px; height:52px; flex:0 0 52px; border-radius:13px; box-shadow:0 6px 16px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
.brand-text h1{font-size:20px; color:#fff; line-height:1.05;}
.brand-text span{display:block; font-size:11px; color:rgba(255,255,255,.65); font-weight:500; margin-top:3px; letter-spacing:.3px;}
nav.tabs{flex:1; padding:14px 10px; overflow-y:auto;}
.tab-btn{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left;
  background:none; border:none; color:rgba(255,255,255,.72); padding:10px 11px;
  border-radius:9px; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500;
  margin-bottom:3px; transition:background .15s, color .15s, transform .15s; position:relative;
}
.tab-btn svg{width:17px; height:17px; flex:0 0 17px; opacity:.85; transition:transform .15s;}
.btn svg{width:16px; height:16px; flex:0 0 16px;}
.tab-btn:hover{background:rgba(255,255,255,.09); color:#fff; transform:translateX(2px);}
.tab-btn:hover svg{transform:scale(1.1);}
.tab-btn.active{background:linear-gradient(90deg, var(--red), var(--red-dark)); color:#fff; box-shadow:0 4px 14px var(--red-glow);}
.tab-btn.active svg{opacity:1;}
.tab-lock{margin-left:auto; opacity:.65; font-size:11px;}
.role-box{padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,.14);}
.global-search{position:relative; padding:0 16px 14px;}
.global-search input{width:100%; box-sizing:border-box; padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:#fff; font-size:13px;}
.global-search input::placeholder{color:rgba(255,255,255,.55);}
.global-search input:focus{outline:none; border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.14);}
#globalSearchResults{display:none; position:absolute; top:calc(100% - 8px); left:16px; right:16px; background:#fff; border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.35); max-height:320px; overflow-y:auto; z-index:50;}
#globalSearchResults.show{display:block;}
.gs-item{padding:9px 12px; cursor:pointer; display:flex; flex-direction:column; gap:1px; border-bottom:1px solid var(--line);}
.gs-item:last-child{border-bottom:none;}
.gs-item:hover{background:var(--blue-light);}
.gs-item b{font-size:12.5px; color:var(--ink);}
.gs-item span{font-size:11px; color:var(--muted);}
.gs-empty{padding:12px; font-size:12.5px; color:var(--muted); text-align:center;}
.role-pill{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:rgba(255,255,255,.08); border-radius:9px; padding:9px 11px; font-size:12px;
}
.role-pill b{font-weight:600; color:#fff;}
.role-pill button{
  background:rgba(255,255,255,.16); border:none; color:#fff; padding:6px 10px; border-radius:6px;
  font:inherit; font-size:11.5px; cursor:pointer; font-weight:600; transition:background .15s, transform .15s;
}
.role-pill button:hover{background:var(--red); transform:translateY(-1px);}

/* ---- Main ---- */
main{flex:1; min-width:0; padding:30px 34px 60px; max-width:1180px;}
main.fade-in{animation:fadeUp .3s ease;}
.page-head{margin-bottom:22px; display:flex; align-items:center; gap:16px;}
.page-head .icon-badge{
  width:46px; height:46px; flex:0 0 46px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(140deg, var(--blue), var(--blue-mid)); color:#fff; box-shadow:0 6px 16px rgba(51,80,154,.3);
}
.page-head .icon-badge svg{width:23px; height:23px;}
.page-head h2{font-size:31px; color:var(--ink);}
.page-head p{margin:3px 0 0; color:var(--muted); font-size:13.5px;}

.stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px;}
.stat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  box-shadow:var(--shadow); position:relative; overflow:hidden; animation:popIn .3s ease backwards;
}
.stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent, var(--blue));}
.stat-card .n{font-family:'Barlow Condensed'; font-size:30px; font-weight:800; line-height:1; color:var(--ink);}
.stat-card .l{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; font-weight:600; margin-top:4px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:20px; transition:box-shadow .2s; animation:fadeUp .4s ease backwards;}
.card:nth-of-type(1){animation-delay:.03s;}
.card:nth-of-type(2){animation-delay:.08s;}
.card:nth-of-type(3){animation-delay:.13s;}
.card:nth-of-type(4){animation-delay:.18s;}
.card:hover{box-shadow:var(--shadow-lift);}
.link-name{color:var(--blue); cursor:pointer;}
.link-name:hover{text-decoration:underline;}

/* Collapsible section — same look as .card, but closed by default so long
   tabs (fiches, chambres, présences) don't force a huge scroll on phones.
   Content stays in the DOM either way, so nothing breaks when collapsed. */
.collapsible{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;}
.collapsible > summary{list-style:none; cursor:pointer; padding:16px 22px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; user-select:none;}
.collapsible > summary::-webkit-details-marker{display:none;}
.collapsible > summary .chev{display:inline-flex; transition:transform .15s ease; flex-shrink:0; color:var(--muted);}
.collapsible[open] > summary .chev{transform:rotate(90deg);}
.collapsible > summary .collapsible-badge{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted); background:var(--bg); border-radius:20px; padding:2px 10px;}
.collapsible > .collapsible-body{padding:0 24px 22px;}
.collapsible-sub{border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden;}
.collapsible-sub > summary{list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:center; gap:9px; font-weight:600; font-size:13.5px; user-select:none; background:var(--bg);}
.collapsible-sub > summary::-webkit-details-marker{display:none;}
.collapsible-sub > summary .chev{display:inline-flex; transition:transform .15s ease; flex-shrink:0; color:var(--muted);}
.collapsible-sub[open] > summary .chev{transform:rotate(90deg);}
.collapsible-sub > .collapsible-body{padding:14px;}
.card h3{font-size:18px; margin-bottom:12px; color:var(--ink); position:relative; padding-left:14px;}
.card h3::before{content:''; position:absolute; left:0; top:9px; width:5px; height:5px; border-radius:50%; background:var(--red);}
.card h3 small{display:block; font-family:'Inter'; font-weight:400; color:var(--muted); font-size:12px; margin-top:3px;}
.grid2{display:grid; grid-template-columns:280px 1fr; gap:18px; align-items:start;}
.grid-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px 14px; margin-bottom:12px;}
.grid-form .field{min-width:0;}

label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px;}
input,select,textarea{
  width:100%; min-width:0; box-sizing:border-box; font:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--line-strong);
  border-radius:8px; background:#fbfbfd; color:var(--ink); transition:border-color .15s, box-shadow .15s, background .15s;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(51,80,154,.15); background:#fff;}
textarea{resize:vertical; min-height:60px;}
.field{margin-bottom:0;}

.btn{
  display:inline-flex; align-items:center; gap:6px; background:var(--blue); color:#fff; border:none;
  padding:9px 16px; border-radius:8px; font:inherit; font-weight:600; font-size:13px; cursor:pointer;
  transition:background .15s, transform .12s, box-shadow .15s; box-shadow:0 2px 8px rgba(51,80,154,.25); white-space:nowrap;
}
.btn:hover{background:var(--blue-dark); transform:translateY(-1px); box-shadow:0 6px 14px rgba(51,80,154,.32);}
.btn:active{transform:translateY(0);}
.btn.red{background:var(--red); box-shadow:0 2px 8px var(--red-glow);} .btn.red:hover{background:var(--red-dark);}
.btn.ghost{background:transparent; color:var(--blue); border:1px solid var(--line-strong); box-shadow:none;}
.btn.ghost:hover{background:var(--blue-light); transform:translateY(-1px); box-shadow:0 4px 10px rgba(28,34,48,.08);}
.btn.sm{padding:6px 11px; font-size:12px;}
.btn.danger{background:var(--surface); color:var(--red); border:1px solid var(--red-light); box-shadow:none;}
.btn.danger:hover{background:var(--red-light); transform:translateY(-1px);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); font-weight:700; padding:9px 10px; border-bottom:2px solid var(--line);}
td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr{transition:background .12s;}
tr:hover td{background:var(--blue-light);}
.table-wrap{overflow-x:auto;}
.empty{color:var(--muted); font-style:italic; padding:20px 4px; font-size:13px; text-align:center; background:var(--bg); border-radius:9px;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:.2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
.badge.green{background:var(--green-light); color:var(--green);}
.badge.gray{background:var(--gray-light); color:var(--gray);}
.badge.red{background:var(--red-light); color:var(--red-dark);}
.badge.amber{background:var(--amber-light); color:var(--amber);}
.badge.violet{background:var(--violet-light); color:var(--violet);}
.badge.blue{background:var(--blue-light); color:var(--blue-dark);}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block;}

.interne-list{border:1px solid var(--line); border-radius:12px; overflow:hidden; max-height:560px; overflow-y:auto;}
.interne-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 13px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s, padding-left .15s; border-left:3px solid transparent;}
.interne-row .nm{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.interne-row:last-child{border-bottom:none;}
.interne-row:hover{background:var(--bg); padding-left:16px;}
.interne-row.active{background:var(--blue-light); border-left:3px solid var(--red);}
.interne-row .sc{font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-avatar{width:36px; height:36px; border-radius:9px; overflow:hidden; flex:0 0 36px; display:flex; align-items:center; justify-content:center; background:var(--blue-light); color:var(--blue-dark); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px;}
.row-avatar img{width:100%; height:100%; object-fit:cover; display:block;}

.semainier{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px;}
.day-card{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; box-shadow:var(--shadow); display:flex; flex-direction:column; transition:box-shadow .2s, transform .2s;}
.day-card:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px);}
.day-card .day-head{padding:12px 16px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; letter-spacing:.3px; color:#fff;}
.day-card textarea{border:none; border-radius:0; flex:1; min-height:220px; padding:16px; font-size:14.5px; line-height:1.5; resize:vertical; background:#fbfbfd; font-family:inherit; color:var(--ink);}
.day-card textarea:focus{outline:none; box-shadow:inset 0 0 0 2px var(--blue); background:#fff;}
.day-card textarea::placeholder{color:var(--muted);}
@media (max-width:900px){ .semainier{grid-template-columns:repeat(2, minmax(0,1fr));} }
@media (max-width:560px){ .semainier{grid-template-columns:1fr;} }

.type-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.type-tab{padding:7px 14px; border-radius:20px; border:1px solid var(--line-strong); background:#fff; font:inherit; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s;}
.type-tab:hover{background:var(--bg); color:var(--ink);}
.type-tab.active{background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 3px 10px rgba(51,80,154,.28);}

.inline-edit{border:1px solid var(--line); background:#fbfbfd; padding:6px 8px; border-radius:6px; font:inherit; font-size:12.5px; width:100%; color:var(--ink); transition:all .15s;}
.inline-edit:hover{background:var(--bg); border-color:var(--line-strong);}
.inline-edit:focus{background:#fff; border-color:var(--blue); box-shadow:0 0 0 2px rgba(51,80,154,.15); outline:none;}
.inline-edit::placeholder{color:var(--muted); font-style:italic;}
.inline-edit-alert{background:var(--red-light); color:var(--red-dark); font-weight:600; border-color:transparent;}
.inline-edit-alert:hover{background:var(--red-light); border-color:var(--red);}
.inline-edit-area{resize:none; overflow:hidden; min-height:36px; font-family:inherit; line-height:1.4; display:block;}

.urgence-card{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; background:#fff; transition:box-shadow .15s;}
.urgence-card:hover{box-shadow:var(--shadow);}
.urgence-card-head{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px 12px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line);}
.urgence-card-head .nm{font-weight:700; font-size:14.5px; color:var(--ink);}
.urgence-card-head .contact{font-size:12px; color:var(--muted);}
.urgence-fields{display:grid; grid-template-columns:1fr 1fr 90px; gap:12px; align-items:start;}
.urgence-fields label{margin-bottom:3px;}
@media (max-width:760px){ .urgence-fields{grid-template-columns:1fr;} }

.presence-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
.presence-card{border:1.5px solid var(--line); border-radius:12px; padding:14px 10px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; background:#fff; transition:all .15s; text-align:center; position:relative;}
.presence-card:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px); border-color:var(--blue-light);}
.presence-card.present{border-color:var(--green); background:var(--green-light);}
.presence-card.na{border-color:var(--amber); background:var(--amber-light); opacity:.85;}
.presence-card.absent-checked{border-color:var(--red); background:var(--red-light);}
.presence-card.unchecked{border-style:dashed; border-color:var(--line-strong);}
.presence-card .p-avatar{width:56px; height:56px; border-radius:12px; overflow:hidden; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; color:var(--blue-dark); flex:0 0 56px;}
.presence-card .p-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.presence-card .p-name{font-size:12.5px; font-weight:700; line-height:1.25; color:var(--ink);}
.presence-card .p-room{font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
.presence-card .p-meta{font-size:9.5px; color:var(--muted); margin-top:-4px;}
.presence-card .p-check{position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; transition:all .15s;}
.presence-card.present .p-check{background:var(--green); border-color:var(--green);}
.presence-card.na .p-check{background:var(--amber); border-color:var(--amber);}
.presence-card.absent-checked .p-check{background:var(--red); border-color:var(--red);}
@keyframes presenceConfirm{0%{transform:scale(1);} 35%{transform:scale(.93);} 60%{box-shadow:0 0 0 6px rgba(30,142,90,.25);} 100%{transform:scale(1); box-shadow:none;}}
.presence-card.just-updated{animation:presenceConfirm .45s ease;}

.filters{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.filters select, .filters input{width:auto; min-width:150px;}
.check-row{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
.check-row input{width:auto;}

.gauge{display:flex; gap:3px;}
.gauge i{width:14px; height:9px; border-radius:2px; background:var(--gray-light); display:inline-block; transition:background .2s;}
.gauge i.on{background:var(--red); box-shadow:0 0 6px var(--red-glow);}

.photo-frame{width:92px; height:92px; border-radius:14px; overflow:hidden; background:var(--blue-light); display:flex; align-items:center; justify-content:center; flex:0 0 92px; border:1px solid var(--line); box-shadow:var(--shadow); position:relative;}
.photo-frame img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-frame .photo-placeholder{font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; color:var(--blue); display:flex; align-items:center; justify-content:center; width:100%; height:100%;}
.photo-upload-btn{position:relative; overflow:hidden; display:inline-flex;}
.photo-upload-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}

.lock-note{display:flex; align-items:center; gap:8px; background:var(--amber-light); color:var(--amber); border-radius:8px; padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:16px;}
.lock-note svg{width:15px; height:15px; flex:0 0 15px;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.three-col{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
@media (max-width:760px){ .three-col{grid-template-columns:1fr;} }

.gallery-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
.gallery-item{position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--blue-light); box-shadow:var(--shadow); cursor:pointer;}
.gallery-item img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s;}
.gallery-item:hover img{transform:scale(1.05);}
.gallery-skel{width:100%; height:100%; background:linear-gradient(100deg, var(--blue-light) 30%, var(--line) 50%, var(--blue-light) 70%); background-size:200% 100%; animation:skel 1.3s infinite;}
@keyframes skel{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
.gallery-caption{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent, rgba(0,0,0,.65)); color:#fff; font-size:10.5px; padding:14px 8px 6px; pointer-events:none;}

.cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
.cal-dow{font-weight:700; font-size:11px; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase; letter-spacing:.3px;}
.cal-cell{min-height:68px; border:1px solid var(--line); border-radius:9px; padding:6px; cursor:pointer; background:#fff; transition:all .15s;}
.cal-cell:hover{box-shadow:var(--shadow); border-color:var(--blue-light); transform:translateY(-1px);}
.cal-cell.cal-empty{border:none; cursor:default; background:transparent;}
.cal-cell.cal-empty:hover{box-shadow:none; transform:none;}
.cal-cell.cal-conge{background:var(--gray-light);}
.cal-cell.cal-today{border-color:var(--blue); background:var(--blue-light);}
.cal-daynum{font-weight:700; font-size:12.5px; color:var(--ink);}
.cal-dots{display:flex; gap:3px; margin-top:6px; flex-wrap:wrap;}
.cal-dot{width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 7px;}
@media (max-width:760px){ .cal-cell{min-height:44px; padding:4px;} .cal-daynum{font-size:11px;} }
@media (max-width:980px){
  #app{flex-direction:column;}
  .sidebar{width:100%; flex:none; height:auto; position:relative;}
  nav.tabs{display:flex; flex-wrap:wrap;}
  .tab-btn{width:auto;}
  main{max-width:100%; padding:20px;}
  .grid2, .two-col{grid-template-columns:1fr;}
}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}

#printArea{display:none;}
@media print{
  body{ background:#fff !important; background-image:none !important; }
  body > *:not(#printArea){ display:none !important; }
  #printArea{
    display:block !important; font-family:Arial,Helvetica,sans-serif; color:#1c2230;
    padding:24px; max-width:100%; margin:0; line-height:1.5; background:#fff;
  }
  #printArea h1{font-size:22px; margin:0 0 4px; border-bottom:3px solid #D6402C; padding-bottom:10px;}
  #printArea .print-meta{color:#666; font-size:12px; margin-bottom:22px;}
  #printArea .section-title{font-weight:bold; margin:22px 0 8px; font-size:14px; border-left:4px solid #33509A; padding-left:8px; text-transform:uppercase; letter-spacing:.3px;}
  #printArea table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:6px;}
  #printArea th, #printArea td{border:1px solid #ccc; padding:6px 8px; text-align:left; vertical-align:top;}
  #printArea th{background:#f2f2f2 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #printArea .kv{display:grid; grid-template-columns:170px 1fr; gap:4px 12px; font-size:13px; margin-bottom:4px;}
  #printArea .kv b{color:#444;}
  #printArea .print-photo{width:90px; height:90px; object-fit:cover; border-radius:8px; float:right; margin-left:16px; border:1px solid #ccc;}
  #printArea .badge-print{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold; background:#eee;}
}

.modal-overlay{position:fixed; inset:0; background:rgba(20,26,46,.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; animation:fadeUp .15s ease;}
.modal{background:#fff; border-radius:14px; padding:24px; width:auto; min-width:300px; max-width:92vw; box-shadow:0 24px 60px rgba(10,16,36,.35); animation:popIn .2s ease;}
.modal h3{margin-bottom:10px;}
.modal p{font-size:12.5px; color:var(--muted); margin:0 0 12px;}
.toast{position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:11px 20px; border-radius:9px; font-size:13px; font-weight:600; z-index:60; box-shadow:0 10px 28px rgba(0,0,0,.3); opacity:0; transform:translateY(10px); transition:all .25s cubic-bezier(.34,1.56,.64,1); border-left:3px solid var(--red);}
.toast.show{opacity:1; transform:translateY(0);}
</style>

<script type="module">
  // ============================= FIREBASE BACKEND =============================
  // Replaces Claude's window.storage (only available inside claude.ai) with a
  // real, independently-hosted database. Everything else in the app still
  // just calls window.storage.get/set/delete/list exactly as before.
  //
  // SETUP — replace the placeholders below with your own Firebase project's
  // config. These values are safe to expose publicly; Firebase's security
  // model relies on server-side rules, not on keeping this config secret.
  const firebaseConfig = {
    apiKey: "AIzaSyBy4aWPIkUpYk2TCHRVtNakOXHJ8yCnIWc",
    authDomain: "internat-liege-atlas-b49f8.firebaseapp.com",
    projectId: "internat-liege-atlas-b49f8",
    storageBucket: "internat-liege-atlas-b49f8.firebasestorage.app",
    messagingSenderId: "287775341826",
    appId: "1:287775341826:web:d539121bb8306745d3161b"
  };
  const COLLECTION = 'internat_data';

  async function initFirebase(){
    const { initializeApp, deleteApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
    const { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.storage = {
      async get(key, shared){
        const snap = await getDoc(doc(db, COLLECTION, key));
        if(!snap.exists()) throw new Error('not found');
        return { key, value: snap.data().value, shared };
      },
      async set(key, value, shared){
        await setDoc(doc(db, COLLECTION, key), { value, updatedAt: Date.now() });
        return { key, value, shared };
      },
      async delete(key, shared){
        await deleteDoc(doc(db, COLLECTION, key));
        return { key, deleted: true, shared };
      },
      async list(prefix, shared){
        const snap = await getDocs(collection(db, COLLECTION));
        const keys = [];
        snap.forEach(d => { if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
        return { keys, prefix, shared };
      },
      // Live updates: calls back with the new raw value whenever this document
      // changes on the server (from any device). Skips the "echo" snapshot
      // Firestore fires for our own pending local writes, since the app has
      // already applied those to STATE itself — this only fires for changes
      // that came from somewhere else.
      watch(key, shared, callback){
        return onSnapshot(doc(db, COLLECTION, key), snap => {
          if(snap.metadata.hasPendingWrites) return;
          if(!snap.exists()) return;
          callback(snap.data().value);
        }, err => console.error('watch() error for', key, err));
      }
    };

    // Real per-person accounts. Firebase Auth needs an email format, so each
    // person's first name is turned into a fake, never-emailed address
    // (e.g. "Caroline" -> caroline@internat-liege-atlas.local). Their role
    // (educateur/direction) is stored alongside the fiches/sanctions data,
    // under a "user:<uid>" key, using the exact same window.storage plumbing.
    function toEmail(name){
      const slug = name.trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '');
      return slug + '@internat-liege-atlas.local';
    }
    async function fetchRole(uid){
      const snap = await getDoc(doc(db, COLLECTION, 'user:'+uid));
      if(!snap.exists()) return null;
      return JSON.parse(snap.data().value);
    }

    window.__auth = {
      async login(name, password){
        const cred = await signInWithEmailAndPassword(auth, toEmail(name), password);
        const role = await fetchRole(cred.user.uid);
        if(!role){ await signOut(auth); throw new Error('missing-role'); }
        if(role.active===false){ await signOut(auth); throw new Error('account-disabled'); }
        return { uid: cred.user.uid, name: role.name, role: role.role };
      },
      async setupFirstAccount(name, password){
        const cred = await createUserWithEmailAndPassword(auth, toEmail(name), password);
        await setDoc(doc(db, COLLECTION, 'user:'+cred.user.uid), { value: JSON.stringify({ name, role: 'direction', active: true }) });
        // Permanently closes the self-service bootstrap path in the security
        // rules — after this, only an already-signed-in Direction account can
        // create further accounts (via "Gestion de l'équipe").
        await setDoc(doc(db, COLLECTION, 'system:initialized'), { value: 'true' });
        return { uid: cred.user.uid, name, role: 'direction' };
      },
      // Creates a new account without disturbing the Direction member who is
      // currently logged in — done via a throwaway secondary Firebase app
      // instance, since creating a user normally auto-signs-in as them.
      async createAccount(name, password, role){
        const secApp = initializeApp(firebaseConfig, 'secondary-'+Date.now());
        const secAuth = getAuth(secApp);
        const cred = await createUserWithEmailAndPassword(secAuth, toEmail(name), password);
        const uid = cred.user.uid;
        await setDoc(doc(db, COLLECTION, 'user:'+uid), { value: JSON.stringify({ name, role, active: true }) });
        await signOut(secAuth);
        await deleteApp(secApp);
        return { uid, name, role };
      },
      async listAccounts(){
        const snap = await getDocs(collection(db, COLLECTION));
        const out = [];
        snap.forEach(d => { if(d.id.startsWith('user:')){
          const data = JSON.parse(d.data().value);
          out.push({ uid: d.id.slice(5), ...data, active: data.active!==false });
        }});
        return out;
      },
      // Turns app access on/off for someone without touching their Firebase
      // Auth credential (the client SDK can only ever delete the currently
      // signed-in user, never someone else's — see deleteAccount below).
      // Login and the auto-resume-session check both refuse role documents
      // with active:false, so this alone is enough to lock a departed or
      // temporary person out immediately, and it's fully reversible.
      async setActive(uid, active){
        const role = await fetchRole(uid);
        if(!role) throw new Error('Compte introuvable');
        await setDoc(doc(db, COLLECTION, 'user:'+uid), { value: JSON.stringify({ ...role, active }) });
      },
      // Removes the person's role record, which revokes their access to the
      // app's data immediately (login() and the session-resume check both
      // require it). This does NOT delete their underlying Firebase Auth
      // login (email+password) — the client SDK has no way to delete another
      // user's credential; that last step still needs the Firebase console,
      // same as password resets already do elsewhere in this app.
      async deleteAccount(uid){
        await deleteDoc(doc(db, COLLECTION, 'user:'+uid));
      },
      async logout(){ await signOut(auth); },
      onAuthStateChanged(cb){ return onAuthStateChanged(auth, cb); },
      fetchRole,
    };

    window.__firebaseReadyResolve();
  }

  initFirebase().catch(e => {
    console.error('Firebase initialization failed:', e);
    // Fall back to objects that always error clearly — the app's existing
    // retry/error-toast logic takes it from there instead of hanging silently.
    const failMsg = 'Firebase non configuré ou injoignable : ' + e.message;
    window.storage = {
      get: async()=>{ throw new Error(failMsg); },
      set: async()=>{ throw new Error(failMsg); },
      delete: async()=>{ throw new Error(failMsg); },
      list: async()=>({ keys: [] }),
      watch: ()=>{ /* no-op */ },
    };
    window.__auth = {
      login: async()=>{ throw new Error(failMsg); },
      setupFirstAccount: async()=>{ throw new Error(failMsg); },
      createAccount: async()=>{ throw new Error(failMsg); },
      listAccounts: async()=>[],
      setActive: async()=>{ throw new Error(failMsg); },
      deleteAccount: async()=>{ throw new Error(failMsg); },
      logout: async()=>{},
      onAuthStateChanged(){},
    };
    window.__firebaseReadyResolve();
  });

  // ============================= ACCESS GATE (real login) =============================
  const gateScreen = document.getElementById('gateScreen');
  const loginView = document.getElementById('gateLoginView');
  const setupView = document.getElementById('gateSetupView');
  const gateUser = document.getElementById('gateUser');
  const gatePass = document.getElementById('gatePass');
  const gateSharedDevice = document.getElementById('gateSharedDevice');
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');
  const setupName = document.getElementById('setupName');
  const setupPass = document.getElementById('setupPass');
  const setupBtn = document.getElementById('setupBtn');
  const setupError = document.getElementById('setupError');

  // ---- "Shared device" auto-logout ----
  // A phone is one person's device: staying signed in between visits is
  // exactly what you want. A tablet left lying around the internat is not —
  // Firebase persists the session locally, so without this, whoever last
  // logged in on it stays silently signed in for anyone who picks it up
  // next. Ticking "cet appareil est partagé" at login turns on a short
  // inactivity timeout for THIS BROWSER ONLY (stored on the device itself,
  // not in the shared data), independent of who logs into it afterwards.
  const SHARED_KEY = 'internatSharedDevice';
  const ACTIVITY_KEY = 'internatLastActivity';
  const IDLE_LOGOUT_MS = 10 * 60 * 1000;       // no touch for 10 min while open
  const BACKGROUND_LOGOUT_MS = 3 * 60 * 1000;  // app backgrounded/closed for 3+ min
  function isSharedDevice(){ return localStorage.getItem(SHARED_KEY) === '1'; }
  window.isSharedDevice = isSharedDevice; // renderShell() (hors du <script type="module">) en a besoin
  function setSharedDevice(v){ localStorage.setItem(SHARED_KEY, v ? '1' : '0'); }
  function touchActivity(){ try{ localStorage.setItem(ACTIVITY_KEY, String(Date.now())); }catch(e){} }
  function msSinceActivity(){
    const v = Number(localStorage.getItem(ACTIVITY_KEY));
    return v ? (Date.now() - v) : Infinity;
  }
  gateSharedDevice.checked = isSharedDevice();
  touchActivity();
  try{
    const pendingReason = sessionStorage.getItem('internatLogoutReason');
    if(pendingReason){ gateError.textContent = 'Session fermée automatiquement (appareil partagé — '+pendingReason+') — reconnectez-vous.'; sessionStorage.removeItem('internatLogoutReason'); }
  }catch(e){}
  ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, touchActivity, { passive:true }));
  setInterval(()=>{
    if(isSharedDevice() && window.CURRENT_USER && msSinceActivity() > IDLE_LOGOUT_MS) forceSharedLogout('inactivité prolongée');
  }, 20000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) touchActivity();
    else if(isSharedDevice() && window.CURRENT_USER && msSinceActivity() > BACKGROUND_LOGOUT_MS) forceSharedLogout('appareil resté en arrière-plan');
  });
  async function forceSharedLogout(reason){
    window.CURRENT_USER = null;
    try{ sessionStorage.setItem('internatLogoutReason', reason); }catch(e){}
    try{ await window.__auth.logout(); }catch(e){}
    location.reload();
  }

  function unlockApp(user){
    window.CURRENT_USER = user;
    touchActivity();
    gateScreen.style.display = 'none';
    window.__gateResolve && window.__gateResolve();
  }
  window.__gatePromise = new Promise(resolve => { window.__gateResolve = resolve; });

  (async () => {
    await window.__firebaseReady;
    // If this device already has a signed-in session (Firebase persists it),
    // skip straight past the login form — UNLESS this is a shared device
    // that's been idle/closed past the threshold, in which case the whole
    // point is to NOT silently resume as whoever used it last.
    window.__auth.onAuthStateChanged(async firebaseUser => {
      if(firebaseUser && !window.CURRENT_USER){
        if(isSharedDevice() && msSinceActivity() > BACKGROUND_LOGOUT_MS){
          try{ await window.__auth.logout(); }catch(e){}
          gateError.textContent = 'Appareil partagé : reconnectez-vous (session précédente fermée automatiquement).';
          return;
        }
        try{
          const role = await window.__auth.fetchRole(firebaseUser.uid);
          if(role && role.active===false){ await window.__auth.logout(); return; }
          if(role) unlockApp({ uid: firebaseUser.uid, name: role.name, role: role.role });
        }catch(e){ /* stay on the login screen */ }
      }
    });
  })();

  async function tryLogin(){
    gateError.textContent = '';
    if(!gateUser.value.trim() || !gatePass.value){ gateError.textContent = 'Prénom et mot de passe requis.'; return; }
    try{
      const user = await window.__auth.login(gateUser.value.trim(), gatePass.value);
      setSharedDevice(gateSharedDevice.checked);
      unlockApp(user);
    }catch(e){
      gateError.textContent = (e.message||'').includes('account-disabled')
        ? 'Ce compte a été désactivé. Contactez la Direction.'
        : 'Identifiant ou mot de passe incorrect.';
    }
  }
  async function tryFirstSetup(){
    setupError.textContent = '';
    if(!setupName.value.trim() || setupPass.value.length < 4){ setupError.textContent = 'Prénom et mot de passe (4 caractères min.) requis.'; return; }
    try{
      const user = await window.__auth.setupFirstAccount(setupName.value.trim(), setupPass.value);
      unlockApp(user);
    }catch(e){
      setupError.textContent = e.message && e.message.includes('email-already-in-use')
        ? 'Un compte existe déjà pour ce prénom — utilisez la connexion normale.'
        : 'Erreur : ' + (e.message || e);
    }
  }
  gateBtn.addEventListener('click', tryLogin);
  gatePass.addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });
  setupBtn.addEventListener('click', tryFirstSetup);
  setupPass.addEventListener('keydown', e => { if(e.key === 'Enter') tryFirstSetup(); });
  document.getElementById('gateSetupLink').addEventListener('click', () => { loginView.style.display='none'; setupView.style.display='block'; });
  document.getElementById('setupBackLink').addEventListener('click', () => { setupView.style.display='none'; loginView.style.display='block'; });
</script>

async function loadAll(){
  if(typeof window.storage === 'undefined' || !window.storage){
    console.error('window.storage is not available in this environment — nothing will be saved.');
    showToast('Stockage indisponible : les modifications ne seront pas sauvegardées');
  }
  let internesKeyFound = false;
  await Promise.all(KEYS.map(async k=>{
    try{
      const r = await window.storage.get(k, true);
      if(r && r.value!==undefined){ STATE[k] = JSON.parse(r.value); if(k==='internes') internesKeyFound = true; }
    }catch(e){ /* key genuinely absent on first run: this is expected, not an error */ }
  }));
  if(!internesKeyFound){
    STATE.internes = DEFAULT_INTERNES_RAW.map(i=>({ id:uid(), ...i }));
    await persist('internes');
  }
  // One-time cleanup: earlier versions imported a few stray comment/header
  // rows from the source spreadsheet as if they were real students.
  const JUNK_NAMES = new Set(['NOUVEAUX','NOUVELLES','Je les ai fait tous réussir','Je les ai fait toute réussir']);
  const cleaned = STATE.internes.filter(i=>!JUNK_NAMES.has((i.nom||'').trim()));
  if(cleaned.length !== STATE.internes.length){
    STATE.internes = cleaned;
    await persist('internes');
  }
  // One-time migration: allergy/medical/blood-type info used to live only as
  // free text inside "notes". Split it out into their own editable fields so
  // the Urgences & Santé tab can be updated directly, without touching notes.
  let migratedHealth = false;
  STATE.internes.forEach(i=>{
    if(i.allergie===undefined){
      i.allergie = extractAllergy(i.notes) || '';
      i.medical = extractMedical(i.notes) || '';
      i.groupeSanguin = extractBloodType(i.notes) || '';
      migratedHealth = true;
    }
  });
  if(migratedHealth) await persist('internes');
  // One-time migration: chambres used to hold a single occupant via
  // "interneId". Moving to a capacity + list-of-occupants model so a chambre
  // can hold several internes (chambres à deux, appartements jusqu'à 4).
  let migratedChambres = false;
  STATE.chambres.forEach(c=>{
    if(!Array.isArray(c.interneIds)){
      c.interneIds = c.interneId ? [c.interneId] : [];
      delete c.interneId;
      migratedChambres = true;
    }
    if(!c.capacite){
      c.capacite = Math.max(1, c.interneIds.length);
      migratedChambres = true;
    }
  });
  if(migratedChambres) await persist('chambres');
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function persist(key, attempt=1){
  if(typeof window.storage === 'undefined' || !window.storage){
    showToast('Stockage indisponible : window.storage est absent de cet environnement');
    console.error('persist("'+key+'") failed: window.storage is undefined');
    return false;
  }
  try{
    const r = await window.storage.set(key, JSON.stringify(STATE[key]), true);
    if(!r){
      throw new Error('réponse vide du stockage');
    }
    return true;
  }catch(e){
    console.error('persist("'+key+'") attempt '+attempt+' failed:', e);
    // Transient server-side hiccups (timeouts, "Internal server error", etc.)
    // often succeed on a quick retry, so try a couple more times before
    // bothering the person with an error they can't do anything about.
    if(attempt < 3){
      await sleep(attempt * 600);
      return persist(key, attempt + 1);
    }
    showToast('Erreur de sauvegarde ('+key+') après plusieurs tentatives : '+(e && e.message ? e.message : String(e)));
    return false;
  }
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

/* ============================= PHOTOS ============================= */
// Photos are stored one-per-key (photo:<interneId>) rather than inside the
// 'internes' record, so a large set of imported photos never risks pushing
// a single storage value past its size limit.
const PHOTO_CACHE = {};
let PHOTO_KEY_SET = null; // Set of interne ids that actually have a stored photo, or null if not yet known
async function loadPhotoKeySet(){
  if(PHOTO_KEY_SET) return PHOTO_KEY_SET;
  PHOTO_KEY_SET = new Set();
  try{
    const r = await window.storage.list('photo:', true);
    if(r && r.keys) r.keys.forEach(k=>PHOTO_KEY_SET.add(k.slice('photo:'.length)));
  }catch(e){ console.error('loadPhotoKeySet failed:', e); }
  return PHOTO_KEY_SET;
}
async function getPhoto(id){
  if(PHOTO_CACHE[id]!==undefined) return PHOTO_CACHE[id];
  // Skip the network call entirely for the (common) case of no photo at all.
  if(PHOTO_KEY_SET && !PHOTO_KEY_SET.has(id)){ PHOTO_CACHE[id] = null; return null; }
  try{
    const r = await window.storage.get('photo:'+id, true);
    PHOTO_CACHE[id] = r ? r.value : null;
  }catch(e){ PHOTO_CACHE[id] = null; }
  return PHOTO_CACHE[id];
}
// Runs many async tasks with only a few in flight at once, to avoid bursts
// of parallel storage calls that can trip a message-rate limit.
async function runThrottled(items, worker, limit=4){
  let cursor = 0;
  async function run(){
    while(cursor < items.length){
      const idx = cursor++;
      await worker(items[idx], idx);
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, run));
}

// Fetches photos for many ids at once without flooding storage with parallel
// requests (which can trip a message-rate limit) — a handful run at a time.
async function getPhotosThrottled(ids, onEach, limit=4){
  await loadPhotoKeySet();
  const queue = ids.filter(id => !PHOTO_KEY_SET || PHOTO_KEY_SET.has(id));
  await runThrottled(queue, async id=>{
    const uri = await getPhoto(id);
    if(uri) onEach(id, uri);
  }, limit);
}
async function setPhoto(id, dataUri, attempt=1){
  PHOTO_CACHE[id] = dataUri || null;
  try{
    if(dataUri){ await window.storage.set('photo:'+id, dataUri, true); if(PHOTO_KEY_SET) PHOTO_KEY_SET.add(id); }
    else{ await window.storage.delete('photo:'+id, true); if(PHOTO_KEY_SET) PHOTO_KEY_SET.delete(id); }
  }catch(e){
    console.error('setPhoto("'+id+'") attempt '+attempt+' failed:', e);
    if(attempt < 3){ await sleep(attempt * 600); return setPhoto(id, dataUri, attempt + 1); }
    showToast('Erreur de sauvegarde de la photo après plusieurs tentatives : '+(e && e.message ? e.message : String(e)));
  }
}

// Downscales + re-encodes the JPEG client-side so imported photos stay compact.
function fileToCompressedDataURL(file, maxDim=480, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image invalide'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}

function wireGlobalSearch(){
  const input = document.getElementById('globalSearchInput');
  const results = document.getElementById('globalSearchResults');
  input.placeholder = 'Rechercher un interne, une sanction, une note...';
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.innerHTML=''; results.classList.remove('show'); return; }
    const matches = [
      ...STATE.internes.filter(i=>nomComplet(i).toLowerCase().includes(q)).slice(0,5)
        .map(i=>({kind:'Interne', id:i.id, title:nomComplet(i), sub:i.ecole||''})),
      ...STATE.sanctions.filter(s=>(s.motif||'').toLowerCase().includes(q)).slice(0,4)
        .map(s=>({kind:'Sanction', id:s.interneId, title:nomComplet(getInterne(s.interneId)), sub:`${fmtDate(s.date)} — ${s.motif}`})),
      ...STATE.journal.filter(j=>(j.texte||'').toLowerCase().includes(q)).slice(0,4)
        .map(j=>({kind:'Journal', id:(j.internes||[])[0]||null, tab:'journal', title:(j.internes||[]).length?nomComplet(getInterne(j.internes[0])):'Journal de bord', sub:`${fmtDate(j.date)} — ${(j.texte||'').slice(0,70)}`})),
      ...STATE.communications.filter(c=>(c.titre||'').toLowerCase().includes(q) || (c.texte||'').toLowerCase().includes(q)).slice(0,4)
        .map(c=>({kind:'Communication', tab:'communications', title:c.titre||'Communication', sub:`${fmtDate(c.date)} — ${(c.texte||'').slice(0,70)}`})),
    ];
    results.innerHTML = matches.length
      ? matches.map((m,idx)=>`<div class="gs-item" data-idx="${idx}"><b>${m.title}</b><span>${m.kind} — ${m.sub}</span></div>`).join('')
      : `<div class="gs-empty">Aucun résultat</div>`;
    results.classList.add('show');
    results.querySelectorAll('.gs-item').forEach(el=>el.addEventListener('click',()=>{
      const m = matches[Number(el.dataset.idx)];
      input.value=''; results.innerHTML=''; results.classList.remove('show');
      if(m.id) openInterneDossier(m.id);
      else if(m.tab){ ACTIVE_TAB=m.tab; renderShell(); renderTab(); }
    }));
  });
  input.addEventListener('focus', ()=>{ if(input.value.trim()) results.classList.add('show'); });
  document.addEventListener('click', e=>{
    if(!e.target.closest('.global-search')) results.classList.remove('show');
  }, { once:false });
}

// Ventes entries store the raw select value in vendeurId — either an interne id
// or "edu:<Name>". This resolves it back to a display label either way, and
// stays backward compatible with older entries that used the field "interneId".
function vendeurLabel(v){
  const raw = v.vendeurId || v.interneId;
  if(!raw) return '—';

  return nomComplet(getInterne(raw));

function goTab(id){ ACTIVE_TAB=id; SELECTED_INTERNE=null; renderShell(); renderTab(); }
// The imported "notes" field packs allergy info as free text (e.g. "Allergies : Non"
// or "Allergies : Graminées, bouleau"). This pulls out just that fragment and tells
// whether it's a real flag worth surfacing, so Urgences & Vue d'ensemble can highlight it.
function extractAllergy(notes){
  if(!notes) return '';
  const m = notes.match(/Allergies\s*:\s*([^—;]+)/i);
  if(!m) return '';
  const val = m[1].trim();
  if(!val || /^non\b/i.test(val)) return '';
  return val;
}
function extractMedical(notes){
  if(!notes) return '';
  const m = notes.match(/Médical\s*:\s*([^—;]+)/i);
  return m ? m[1].trim() : '';
}
function extractBloodType(notes){
  if(!notes) return '';
  const m = notes.match(/Groupe sanguin\s*:\s*([A-Z0-9+-]+)/i);
  return m ? m[1].trim() : '';
}
function upcomingBirthdays(days=7){
  const today = new Date(); today.setHours(0,0,0,0);
  const list = [];
  STATE.internes.forEach(i=>{
    if(!i.naissance) return;
    const b = new Date(i.naissance+'T00:00:00');
    if(isNaN(b)) return;
    let next = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if(next < today) next = new Date(today.getFullYear()+1, b.getMonth(), b.getDate());
    const diffDays = Math.round((next-today)/86400000);
    if(diffDays>=0 && diffDays<=days) list.push({interne:i, date:next, diffDays, age: next.getFullYear()-b.getFullYear()});
  });
  return list.sort((a,b)=>a.diffDays-b.diffDays);
}

const MOIS_LABEL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
let CAL_YM = null;
function pad2(n){ return String(n).padStart(2,'0'); }
// Congés scolaires officiels (Communauté française de Belgique). "vacances"
// entries span a date range (inclusive); "ferie" entries are a single day.
// To add a further school year, just append more entries below — every date
// is a plain ISO string ("YYYY-MM-DD") so nothing else needs to change.
const CONGES_SCOLAIRES = [
  {label:"Rentrée scolaire", start:"2026-08-24", end:"2026-08-24", kind:'ferie'},
  {label:"Fête de la Communauté française", start:"2026-09-27", end:"2026-09-27", kind:'ferie'},
  {label:"Vacances d'automne (Toussaint)", start:"2026-10-19", end:"2026-11-01", kind:'vacances'},
  {label:"Fête des morts", start:"2026-11-02", end:"2026-11-02", kind:'ferie'},
  {label:"Jour de l'Armistice", start:"2026-11-11", end:"2026-11-11", kind:'ferie'},
  {label:"Vacances d'hiver (Noël)", start:"2026-12-21", end:"2027-01-03", kind:'vacances'},
  {label:"Mardi gras", start:"2027-02-09", end:"2027-02-09", kind:'ferie'},
  {label:"Vacances de détente (Carnaval)", start:"2027-02-22", end:"2027-03-07", kind:'vacances'},
  {label:"Lundi de Pâques", start:"2027-03-29", end:"2027-03-29", kind:'ferie'},
  {label:"Vacances de printemps (Pâques)", start:"2027-04-26", end:"2027-05-09", kind:'vacances'},
  {label:"Jeudi de l'Ascension", start:"2027-05-06", end:"2027-05-06", kind:'ferie'},
  {label:"Lundi de Pentecôte", start:"2027-05-17", end:"2027-05-17", kind:'ferie'},
  // No end date was given for the summer break, so this only marks its start
  // rather than guessing when it stops — extend it with an "end" once the
  // 2027-2028 rentrée date is known.
  {label:"Début des vacances d'été", start:"2027-07-03", end:"2027-07-03", kind:'ferie'},
];
function congesForDate(dateStr){
  return CONGES_SCOLAIRES.filter(c=>dateStr>=c.start && dateStr<=c.end);
}
function calEventsForDate(dateStr){
  const evs = [];
  congesForDate(dateStr).forEach(c=>evs.push({type:c.kind==='vacances'?'Vacances scolaires':'Jour férié / congé', label:c.label, color:'gray'}));
  STATE.sortiesSemaine.filter(s=>s.date===dateStr && s.statut==='Validé').forEach(s=>evs.push({type:'Sortie de la semaine', label:nomComplet(getInterne(s.interneId))+(s.motif?' — '+s.motif:''), color:'blue', detail:[s.depart?'Départ : '+s.depart:'', s.retour?'Retour : '+s.retour:'', s.educateurs?'Éducateur(s) : '+s.educateurs:'', s.commentaire||''].filter(Boolean).join('\n')}));
  STATE.sortiesInternat.filter(s=>s.date===dateStr).forEach(s=>evs.push({type:'Sortie internat', label:s.intitule||'—', color:'red', detail:[s.type?'Type : '+s.type:'', s.cout?'Coût : '+Number(s.cout).toFixed(2)+' €':'', s.commentaire||''].filter(Boolean).join('\n')}));
  STATE.sortiesExceptionnelles.filter(s=>s.date===dateStr).forEach(s=>evs.push({type:'Entraînement exceptionnel', label:nomComplet(getInterne(s.interneId))+(s.description?' — '+s.description:''), color:'blue'}));
  STATE.communications.forEach(c=>{
    if(c.date===dateStr) evs.push({type:'Communication publiée', label:c.titre||'—', color:'amber', detail:(c.texte||'')+(c.publiePar?'\n— '+c.publiePar:'')});
    if(c.echeance && c.echeance===dateStr) evs.push({type:'Échéance', label:c.titre||'—', color:'amber', detail:(c.texte||'')+(c.publiePar?'\n— '+c.publiePar:'')});
  });
  const parts = dateStr.split('-');
  const m = parts[1], d = parts[2];
  STATE.internes.forEach(i=>{
    if(!i.naissance) return;
    const bparts = i.naissance.split('-');
    if(bparts[1]===m && bparts[2]===d) evs.push({type:'Anniversaire', label:nomComplet(i)+' 🎂', color:'violet'});
  });
  return evs;
}

  `;
  function drawGrid(){
    const y = CAL_YM.y, m = CAL_YM.m;
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay()+6)%7;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const todayStr = todayISO();
    const dowLabels = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    let html = dowLabels.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<startOffset;i++) html += `<div class="cal-cell cal-empty"></div>`;

      const dateStr = `${y}-${pad2(m+1)}-${pad2(day)}`;
      const evs = calEventsForDate(dateStr);
      const isVacances = congesForDate(dateStr).some(c=>c.kind==='vacances');
      html += `<div class="cal-cell ${dateStr===todayStr?'cal-today':isVacances?'cal-conge':''}" data-date="${dateStr}">
        <div class="cal-daynum">${day}</div>
        <div class="cal-dots">${evs.slice(0,5).map(e=>`<span class="cal-dot" style="background:var(--${e.color});" title="${e.label}"></span>`).join('')}</div>

    }
    document.getElementById('calGrid').innerHTML = html;
    document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>cell.addEventListener('click',()=>openDayModal(cell.dataset.date)));
  }

// actually uses the import feature, not on every app load.
let XLSX_LOAD_PROMISE = null;
function loadXLSXLib(){
  if(window.XLSX) return Promise.resolve();
  if(XLSX_LOAD_PROMISE) return XLSX_LOAD_PROMISE;
  XLSX_LOAD_PROMISE = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ XLSX_LOAD_PROMISE = null; reject(new Error('Impossible de charger la bibliothèque de lecture Excel (vérifiez la connexion internet)')); };
    document.head.appendChild(s);
  });
  return XLSX_LOAD_PROMISE;
}
function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normalizeHeader(h){ return stripAccents(h).toLowerCase().replace(/[^a-z0-9]/g,''); }

function guessColumnIndex(field, headers){
  const normed = headers.map(normalizeHeader);
  for(const syn of field.synonyms){
    const exact = normed.indexOf(syn);
    if(exact!==-1) return exact;
  }
  for(let i=0;i<normed.length;i++){
    if(field.synonyms.some(syn=>normed[i].includes(syn))) return i;
  }
  return -1;
}
function normalizeGenre(v){
  const s = normalizeHeader(v);
  if(['g','m','h','garcon','garcons','masculin','homme'].includes(s)) return 'Garçon';
  if(['f','fille','filles','feminin','femme'].includes(s)) return 'Fille';
  return '';
}
function normalizeStatut(v){
  const s = normalizeHeader(v);
  if(!s) return 'Actif';
  if(s.includes('exclu')) return 'Exclu';
  if(s.includes('sorti')) return "Sorti de l'internat";
  return 'Actif';
}
function normalizeYesNo(v){
  const s = normalizeHeader(v);
  if(!s) return '';
  if(['o','oui','yes','y','true','1','x'].includes(s)) return 'Oui';
  if(['n','non','no','false','0'].includes(s)) return 'Non';
  return '';
}
function parseDateFlexible(v){
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  const s = String(v).trim();
  if(!s) return '';
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = (Number(y)<50?'20':'19')+y;
    return `${y}-${pad2(Number(mo))}-${pad2(Number(d))}`;
  }
  return '';
}

  const val = key => { const idx = mapping[key]; return (idx!==undefined && idx>=0) ? row[idx] : ''; };

    id: uid(), nom, prenom: String(val('prenom')||'').trim(),

  if(admin) document.getElementById('addIntBtn').addEventListener('click',()=>{

      <div class="field" style="margin-bottom:10px;"><label>Prénom</label><input id="nPrenom"></div>
      <div class="field" style="margin-bottom:14px;"><label>École</label><input id="nEcole"></div>
      <div class="btn-row"><button class="btn" id="nOk">Ajouter</button><button class="btn ghost" id="nCancel">Annuler</button></div>
    `);
    document.getElementById('nCancel').onclick=closeModal;
    document.getElementById('nOk').onclick=()=>{
      const nom=document.getElementById('nNom').value.trim();
      if(!nom){ showToast('Le nom est requis'); return; }
      STATE.internes.push({id:uid(), nom, prenom:document.getElementById('nPrenom').value.trim(), ecole:document.getElementById('nEcole').value.trim(), statut:'Actif', notes:'', allergie:'', medical:'', groupeSanguin:''});
      persist('internes'); closeModal(); drawList(); showToast('Interne ajouté');
    };
  });
  if(admin){
    let impHeaders = null, impRows = null, impRowGenreHints = [];
    function currentMapping(){
      const mapping = {};
      document.querySelectorAll('.imp-map').forEach(sel=>{ mapping[sel.dataset.field] = Number(sel.value); });
      return mapping;
    }
    function existingKey(i){ return normalizeHeader(i.nom)+'|'+normalizeHeader(i.prenom); }
    function drawPreview(){
      const mapping = currentMapping();
      const built = impRows.map((r,idx)=>buildInterneFromRow(r, mapping, impRowGenreHints[idx])).filter(Boolean);
      const preview = built.slice(0,5);
      document.getElementById('impPreview').innerHTML = preview.length? `
        <table><thead><tr><th>Nom</th><th>Prénom</th><th>Genre</th><th>École</th><th>Classe</th><th>Statut</th><th>Naissance</th></tr></thead>
        <tbody>${preview.map(i=>`<tr><td>${i.nom}</td><td>${i.prenom||'—'}</td><td>${i.genre||'—'}</td><td>${i.ecole||'—'}</td><td>${i.classe||'—'}</td><td>${i.statut}</td><td>${i.naissance?fmtDate(i.naissance):'—'}</td></tr>`).join('')}</tbody></table>
        <div style="font-size:11.5px; color:var(--muted); margin-top:6px;">${built.length} ligne(s) au total dans le fichier (${built.length>5?'aperçu limité aux 5 premières':'toutes affichées'}).</div>
      ` : `<div class="empty">Aucune ligne exploitable avec la correspondance actuelle — vérifiez que la colonne « Nom » est bien choisie.</div>`;
    }
    function drawMapping(){
      const wrap = document.getElementById('impMappingWrap');
      wrap.style.display = '';
      const colOptions = idx0=>['<option value="-1">— Ignorer —</option>', ...impHeaders.map((h,i)=>`<option value="${i}" ${i===idx0?'selected':''}>${h||'(colonne '+(i+1)+')'}</option>`)].join('');
      wrap.innerHTML = `
        <label style="display:block; margin-bottom:8px;">Correspondance des colonnes<span style="color:var(--muted); font-weight:500;"> — pré-remplie automatiquement, à corriger si besoin</span></label>
        <div class="grid-form">${IMPORT_FIELDS.map(f=>{
          const guess = guessColumnIndex(f, impHeaders);
          return `<div class="field"><label>${f.label}${f.required?' *':''}</label><select class="imp-map" data-field="${f.key}">${colOptions(guess)}</select></div>`;
        }).join('')}</div>
        <label style="display:block; margin:14px 0 8px;">Aperçu</label>
        <div class="table-wrap" id="impPreview"></div>
        <div class="btn-row" style="margin-top:10px;"><button class="btn" id="impGo">Importer ces internes</button><button class="btn ghost" id="impCancel">Annuler</button></div>
        <div id="impResult" style="margin-top:8px; font-size:12.5px;"></div>
      `;
      document.querySelectorAll('.imp-map').forEach(sel=>sel.addEventListener('change', drawPreview));
      drawPreview();
      document.getElementById('impCancel').onclick = ()=>{
        impHeaders = null; impRows = null; impRowGenreHints = [];
        document.getElementById('impFile').value = '';
        document.getElementById('impStatus').textContent = '';
        wrap.style.display = 'none'; wrap.innerHTML = '';
      };
      document.getElementById('impGo').onclick = ()=>{
        const mapping = currentMapping();
        if(mapping.nom===-1){ showToast('Choisissez au moins la colonne « Nom »'); return; }
        const existing = new Set(STATE.internes.map(existingKey));
        const seenInFile = new Set();
        let added=0, skippedExisting=0, skippedEmpty=0;
        impRows.forEach((r,idx)=>{
          const rec = buildInterneFromRow(r, mapping, impRowGenreHints[idx]);
          if(!rec){ skippedEmpty++; return; }
          const k = existingKey(rec);
          if(existing.has(k) || seenInFile.has(k)){ skippedExisting++; return; }
          seenInFile.add(k);
          STATE.internes.push(rec);
          added++;
        });
        persist('internes');
        document.getElementById('impResult').textContent = `${added} interne(s) ajouté(s)${skippedExisting?`, ${skippedExisting} ignoré(s) (déjà présent(s))`:''}${skippedEmpty?`, ${skippedEmpty} ligne(s) vide(s) ignorée(s)`:''}.`;
        showToast(`${added} interne(s) importé(s)`);
        renderTab();
      };
    }
    document.getElementById('impFile').addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const statusEl = document.getElementById('impStatus');
      statusEl.textContent = 'Lecture du fichier…';
      try{
        await loadXLSXLib();
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type:'array', cellDates:true });
        const sheetNames = wb.SheetNames.filter(name=>{
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'', raw:true });
          return rows.length>1 && rows.slice(1).some(r=>r.some(c=>String(c||'').trim()!==''));
        });
        if(!sheetNames.length){ statusEl.textContent = 'Fichier vide.'; return; }
        // Every sheet is expected to share the same header row (e.g. one tab per
        // gender, same columns) — the first non-empty sheet's header is used for
        // the column mapping below, and every sheet's data rows are combined.
        const firstRows = XLSX.utils.sheet_to_json(wb.Sheets[sheetNames[0]], { header:1, defval:'', raw:true });
        impHeaders = firstRows[0].map(h=>String(h||'').trim());
        impRows = [];
        impRowGenreHints = [];
        const perSheetCounts = [];
        sheetNames.forEach(name=>{
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'', raw:true });
          const dataRows = rows.slice(1).filter(r=>r.some(c=>String(c||'').trim()!==''));
          perSheetCounts.push(`${name} (${dataRows.length})`);
          // No "genre" column in the file? If a sheet is named "Garçons" / "Filles"
          // (or similar), every row from that sheet inherits that gender — used
          // as a fallback only when the row itself has no explicit genre value.
          const sheetGenreHint = normalizeGenre(name);
          impRows.push(...dataRows);
          dataRows.forEach(()=>impRowGenreHints.push(sheetGenreHint));
        });
        if(!impRows.length){ statusEl.textContent = 'Aucune ligne de données trouvée sous l\'en-tête.'; return; }
        statusEl.textContent = `${impRows.length} ligne(s) trouvée(s) dans « ${file.name} », sur ${sheetNames.length} onglet(s) : ${perSheetCounts.join(', ')}.`;
        drawMapping();
      }catch(err){ statusEl.textContent = 'Erreur de lecture : '+(err.message||err); }
    });
  }
}

      <h3>Carnet infirmerie<small>Médicament donné, visite médecin, petit bobo — pour garder une trace au jour le jour.</small></h3>

  function traitementDue(t, date){ return t.actif!==false && date>=t.dateDebut && (!t.dateFin || date<=t.dateFin); }

/* ============================= SORTIES INTERNAT & COUTS ============================= */
const SORTIE_TYPES = [
  {key:'Loisir', color:'blue'},
  {key:'Culturelle', color:'green'},
  {key:'Sportive', color:'amber'},
  {key:'Obligatoire', color:'red'},
  {key:'Par étage', color:'gray'},
];
function typeBadge(t){
  const info = SORTIE_TYPES.find(x=>x.key===t);
  if(!info) return '<span class="badge gray">—</span>';
  return `<span class="badge ${info.color}">${info.key}</span>`;
}
function monthlyBarChart(rows){
  const map = {};
  rows.forEach(r=>{
    if(!r.date) return;
    const d = new Date(r.date+'T00:00:00');
    if(isNaN(d)) return;
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!map[key]) map[key] = {label: d.toLocaleDateString('fr-BE',{month:'short',year:'numeric'}), total:0};
    map[key].total += Number(r.cout||0);
  });
  const keys = Object.keys(map).sort();
  if(!keys.length) return `<div class="empty">Pas encore de données pour établir un graphique.</div>`;
  const data = keys.map(k=>map[k]);
  const max = Math.max(...data.map(d=>d.total), 1);
  const h = 230, padT=26, padB=36, padSide=14, barGap=18;
  const n = data.length;
  const barW = Math.max(34, Math.min(70, 620/n - barGap));
  const chartW = Math.max(640, padSide*2 + n*(barW+barGap) - barGap);
  const scaleY = (h - padT - padB) / max;
  let bars='', labels='', grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    const y = h - padB - max*f*scaleY;
    grid += `<line x1="${padSide}" y1="${y.toFixed(1)}" x2="${chartW-padSide}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"></line>`;
  });
  data.forEach((d,idx)=>{
    const x = padSide + idx*(barW+barGap);
    const barH = Math.max(3, d.total*scaleY);
    const y = h - padB - barH;
    const isLast = idx===data.length-1;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${barH.toFixed(1)}" rx="7" fill="${isLast?'var(--red)':'var(--blue)'}"></rect>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${d.total.toFixed(0)}\u00A0€</text>`;
    labels += `<text x="${(x+barW/2).toFixed(1)}" y="${h-14}" text-anchor="middle" font-size="12" fill="var(--muted)">${d.label}</text>`;
  });
  return `<div class="table-wrap"><svg viewBox="0 0 ${chartW} ${h}" style="width:100%; min-width:${Math.min(chartW,640)}px; height:${h}px;" role="img" aria-label="Dépenses mensuelles des sorties">
    ${grid}${bars}${labels}
    <line x1="${padSide}" y1="${h-padB}" x2="${chartW-padSide}" y2="${h-padB}" stroke="var(--line-strong)" stroke-width="1.5"></line>
  </svg></div>`;
}
