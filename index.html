      await new Promise(r=>setTimeout(r, 900));
      const resetMap = {
        sanctions: document.getElementById('byearSanctions').checked,
        presences: document.getElementById('byearPresences').checked,
        journal: document.getElementById('byearJournal').checked,
        sortiesSemaine: document.getElementById('byearSorties').checked,
        sortiesInternat: document.getElementById('byearCouts').checked,
        sortiesExceptionnelles: document.getElementById('byearEx').checked,
        infirmerie: document.getElementById('byearInfirmerie').checked,
        communications: document.getElementById('byearComm').checked,
        ventes: document.getElementById('byearVentes').checked,
        rapportsGarde: document.getElementById('byearGarde').checked,
        traitementsPris: document.getElementById('byearTraitementsPris').checked,
      };
      showToast('Archivage en cours...');
      const archiveId = uid();
      const categories = [];
      for(const [key, on] of Object.entries(resetMap)){
        if(!on) continue;
        const data = STATE[key] || [];
        await window.storage.set(`archive:${archiveId}:${key}`, JSON.stringify(data), true);
        categories.push({ key, count: data.length });
      }
      const chambresChecked = document.getElementById('byearChambres').checked;
      if(chambresChecked){
        const occupied = STATE.chambres.filter(c=>(c.interneIds||[]).length);
        if(occupied.length){
          await window.storage.set(`archive:${archiveId}:chambres`, JSON.stringify(occupied), true);
          categories.push({ key:'chambres', count: occupied.reduce((a,c)=>a+(c.interneIds||[]).length,0) });
        }
      }
      STATE.archives.push({ id: archiveId, label, date: todayISO(), categories });
      const toPersist = ['archives'];
      Object.entries(resetMap).forEach(([key, on])=>{ if(on){ STATE[key] = []; toPersist.push(key); } });
      if(chambresChecked){
        STATE.chambres.forEach(c=>{ c.interneIds = []; });
        toPersist.push('chambres');
      }
      await Promise.all(toPersist.map(persist));
      showToast('Bascule effectuée — l\'année « '+label+' » est maintenant dans les archives');
      renderTab();
    };
  };
  async function deleteArchive(a){
    await Promise.all((a.categories||[]).map(c=>window.storage.delete(`archive:${a.id}:${c.key}`, true).catch(()=>{})));
    STATE.archives = STATE.archives.filter(x=>x.id!==a.id);
  }
  function drawArchives(){
    const wrap = document.getElementById('archivesWrap');
    const noticeEl = document.getElementById('archivesRetentionNotice');
    const list = STATE.archives.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const expired = list.filter(isArchiveExpired);
    noticeEl.innerHTML = (admin && expired.length) ? `
      <div style="background:var(--red-light); border-radius:10px; padding:10px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <span style="font-size:13px; color:var(--red-dark);">${expired.length} archive${expired.length>1?'s dépassent':' dépasse'} la durée de conservation de ${ARCHIVE_RETENTION_YEARS} ans.</span>
        <button class="btn sm danger" id="purgeExpired">${ICONS.trash}Purger les archives expirées</button>
      </div>
    ` : '';
    if(admin && expired.length){
      document.getElementById('purgeExpired').onclick = ()=>{
        openModal(`<h3>Purger ${expired.length} archive${expired.length>1?'s':''} ?</h3>
          <p>Ces archives ont dépassé la durée de conservation de ${ARCHIVE_RETENTION_YEARS} ans et seront supprimées définitivement :</p>
          <ul style="margin:0; padding-left:18px; font-size:13px; line-height:1.8;">${expired.map(a=>`<li>${a.label} (archivée le ${fmtDate(a.date)})</li>`).join('')}</ul>
          <div class="btn-row" style="margin-top:12px;"><button class="btn red" id="confirmPurge">Purger</button><button class="btn ghost" id="cancelPurge">Annuler</button></div>`);
        document.getElementById('cancelPurge').onclick = closeModal;
        document.getElementById('confirmPurge').onclick = async ()=>{
          await Promise.all(expired.map(deleteArchive));
          await persist('archives');
          closeModal(); showToast('Archives expirées purgées'); drawArchives();
        };
      };
    }
    wrap.innerHTML = list.length? list.map(a=>{
      const expiredRow = isArchiveExpired(a);
      return `
      <div style="border-bottom:1px solid var(--line); padding:12px 0; ${expiredRow?'opacity:.75;':''}">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div><b style="font-size:14.5px;">${a.label}</b> <span style="color:var(--muted); font-size:12px;">— archivée le ${fmtDate(a.date)}</span> ${expiredRow?'<span class="badge red">Conservation dépassée</span>':''}</div>
          <div class="btn-row">
            <button class="btn sm ghost" data-view="${a.id}">Consulter</button>
            ${admin?`<button class="btn sm danger" data-del-archive="${a.id}">${ICONS.trash}</button>`:''}
          </div>
        </div>
        <div style="margin-top:6px;">${(a.categories||[]).length? a.categories.map(c=>`<span class="badge gray" style="margin:0 5px 5px 0;">${(ARCHIVE_CATEGORIES[c.key]||{label:c.key}).label} (${c.count})</span>`).join('') : '<span class="empty" style="padding:0;">Aucune catégorie archivée</span>'}</div>
      </div>
    `;}).join('') : `<div class="empty">Aucune archive pour le moment — la première bascule d'année en créera une.</div>`;
    document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=>openArchiveModal(b.dataset.view)));
    if(admin) document.querySelectorAll('[data-del-archive]').forEach(b=>b.addEventListener('click', ()=>{
      const a = STATE.archives.find(x=>x.id===b.dataset.delArchive);
      if(!a) return;
      openModal(`<h3>Supprimer l'archive « ${a.label} » ?</h3><p>Cette action est irréversible et supprimera définitivement toutes les données archivées de cette année (elles restent toutefois disponibles dans le fichier .json téléchargé au moment de la bascule, si vous l'avez conservé).</p>
        <div class="btn-row"><button class="btn red" id="confirmDelArchive">Supprimer</button><button class="btn ghost" id="cancelDelArchive">Annuler</button></div>`);
      document.getElementById('cancelDelArchive').onclick = closeModal;
      document.getElementById('confirmDelArchive').onclick = async ()=>{
        await deleteArchive(a);
        await persist('archives');
        closeModal(); showToast('Archive supprimée'); drawArchives();
      };
    }));
  }
  async function openArchiveModal(archiveId){
    const a = STATE.archives.find(x=>x.id===archiveId);
    if(!a) return;
    openModal(`
      <div style="max-width:680px; max-height:78vh; overflow-y:auto;">
        <h3 style="border:none; padding-left:0;">${a.label}<small style="display:block; font-weight:500; color:var(--muted); font-size:12.5px; margin-top:2px;">Archivée le ${fmtDate(a.date)}</small></h3>
        <div class="type-tabs" id="archCatTabs">${(a.categories||[]).map(c=>`<button class="type-tab" data-cat="${c.key}">${(ARCHIVE_CATEGORIES[c.key]||{label:c.key}).label} (${c.count})</button>`).join('') || '<div class="empty">Aucune catégorie archivée.</div>'}</div>
        <div id="archCatContent" style="margin-top:12px;"></div>
        <div class="btn-row" style="margin-top:14px;"><button class="btn sm ghost" id="archCloseBtn">Fermer</button></div>
      </div>
    `);
    document.getElementById('archCloseBtn').onclick = closeModal;
    document.querySelectorAll('#archCatTabs .type-tab').forEach(btn=>btn.addEventListener('click', async ()=>{
      document.querySelectorAll('#archCatTabs .type-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const key = btn.dataset.cat;
      const content = document.getElementById('archCatContent');
      content.innerHTML = `<div class="empty">Chargement…</div>`;
      try{
        const r = await window.storage.get(`archive:${a.id}:${key}`, true);
        const rows = JSON.parse(r.value);
        const meta = ARCHIVE_CATEGORIES[key] || { fmt: x=>JSON.stringify(x) };
        const shown = rows.slice(0, 300);
        content.innerHTML = shown.length? `
          <ul style="margin:0; padding-left:18px; font-size:12.5px; line-height:1.9;">${shown.map(row=>`<li>${meta.fmt(row)}</li>`).join('')}</ul>
          ${rows.length>300?`<div style="font-size:11px; color:var(--muted); margin-top:6px;">+ ${rows.length-300} autre(s) — non affiché(s) ici, mais toujours dans l'archive.</div>`:''}
        ` : `<div class="empty">Aucune donnée dans cette catégorie.</div>`;
      }catch(e){ content.innerHTML = `<div class="empty">Erreur de chargement : ${e.message||e}</div>`; }
    }));
    const firstTab = document.querySelector('#archCatTabs .type-tab');
    if(firstTab) firstTab.click();
  }
  drawArchives();
}

/* ============================= BOOT ============================= */
(async function boot(){
  await window.__gatePromise;
  await window.__firebaseReady;
  await loadAll();
  renderShell();
  renderTab();
  setupLiveSync();
})();

// Real-time sync: Firestore pushes changes made by anyone else straight to
// every open session. For tabs that are mostly "read and glance at" (Vue
// d'ensemble, Calendrier, Présences, Galerie photos), the view just refreshes
// itself. For tabs with active typing (Fiches, Sanctions, Journal...), a
// silent auto-refresh could wipe out an unsaved field, so those just get a
// gentle one-time notice instead, and the existing Actualiser button takes it
// from there when the person is ready.
const LIVE_SAFE_TABS = ['accueil','calendrier','presences','photos'];
let LIVE_NOTICE_PENDING = false;
function setupLiveSync(){
  KEYS.filter(k=>k!=='settings').forEach(key=>{
    window.storage.watch(key, true, raw=>{
      try{ STATE[key] = JSON.parse(raw); }catch(e){ console.error('Live sync parse error for', key, e); return; }
      if(LIVE_SAFE_TABS.includes(ACTIVE_TAB)){
        renderTab();
        showToast('Mise à jour reçue');
      }else if(!LIVE_NOTICE_PENDING){
        LIVE_NOTICE_PENDING = true;
        showToast('Nouvelles données reçues — cliquez sur Actualiser pour les afficher');
      }
    });
  });
}

/* ============================= PWA (best effort) ============================= */
// Registers a minimal service worker so the app qualifies as "installable"
// (Add to Home Screen with the app icon) on browsers/hosting that support it.
// It always prefers the network so a newly-hosted version is picked up on
// the next launch — this only takes effect once the file is served over
// HTTPS from a real web address; it silently does nothing in environments
// (like file:// or a sandboxed preview) that don't support it.
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  try{
    const swCode = `
      const CACHE = 'internat-shell-v1';
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          fetch(e.request).then(res => {
            const copy = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
            return res;
          }).catch(() => caches.match(e.request))
        );
      });
    `;
    const blob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){ /* not supported in this environment — no-op */ }
}
