        <td>${Number(r.cout||0).toFixed(2)} €</td><td>${cumul.toFixed(2)} €</td><td>${r.educateurs||'—'}</td><td>${r.notes||'—'}</td>
        ${admin?`<td><button class="btn sm danger" data-del="${r.id}">${ICONS.trash}</button></td>`:''}</tr>`;}).join('')}</tbody></table>
    `: `<div class="empty">Aucune sortie enregistrée${activeType?' pour ce type':''}.</div>`;
    if(admin) document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      STATE.sortiesInternat = STATE.sortiesInternat.filter(x=>x.id!==b.dataset.del);
      persist('sortiesInternat'); drawAll();
    }));
  }
  function drawAll(){
    const rows = currentRows();
    drawTypeTabs();
    drawStats(rows);
    document.getElementById('cChartWrap').innerHTML = monthlyBarChart(rows);
    drawTable(rows);
  }
  document.getElementById('cPrint').onclick = ()=>{
    const rows = currentRows();
    let cumul = 0;
    const body = `
      <table><thead><tr><th>Date</th><th>Sortie</th><th>Type</th><th>Participants</th><th>Coût</th><th>Cumul</th><th>Éducateur(s)</th></tr></thead>
      <tbody>${rows.map(r=>{ cumul += Number(r.cout||0); return `<tr><td>${fmtDate(r.date)}</td><td>${r.intitule||'—'}</td><td>${r.type||'—'}</td><td>${r.participants||'—'}</td><td>${Number(r.cout||0).toFixed(2)} €</td><td>${cumul.toFixed(2)} €</td><td>${r.educateurs||'—'}</td></tr>`; }).join('')}</tbody></table>
      <div class="section-title">Total ${activeType?'('+activeType+')':'général'} : ${cumul.toFixed(2)} €</div>
    `;
    openPrintWindow('Sorties internat & coûts'+(activeType?' — '+activeType:''), body);
  };
  if(admin) document.getElementById('cAdd').onclick=()=>{
    const intitule=document.getElementById('cIntitule').value.trim();
    if(!intitule){ showToast('L\'intitulé est requis'); return; }
    const type = typeSel.value;
    STATE.sortiesInternat.push({id:uid(), intitule, type, etage: type==='Par étage'?document.getElementById('cEtage').value:'',
      date:document.getElementById('cDate').value, cout:document.getElementById('cCout').value,
      participants:document.getElementById('cPart').value, educateurs:document.getElementById('cEduc').value, notes:document.getElementById('cNotes').value});
    persist('sortiesInternat'); showToast('Sortie ajoutée'); drawAll();
    ['cIntitule','cCout','cPart','cEduc','cNotes'].forEach(id=>document.getElementById(id).value='');
    etageWrap.style.display='none';
  };
  drawAll();
}

/* ============================= SANCTIONS ============================= */
function renderSanctions(main){
  const admin = isAdmin();
  main.innerHTML = `
    <div class="page-head"><div class="icon-badge">${ICONS.sanctions}</div><div><h2>Sanctions</h2><p>Sanctions civiques, disciplinaires et exclusions.</p></div></div>
    <div class="card">
      <h3>Nouvelle sanction<small>Les sanctions civiques peuvent être enregistrées directement par l'équipe. Les sanctions disciplinaires et les exclusions relèvent légalement de la Direction : une proposition de l'équipe éducative est soumise à validation avant de compter. Seule l'exclusion porte un niveau de 1 à 5 : à 5, une exclusion réelle devient possible.</small></h3>
      <div class="grid-form">
        <div class="field"><label>Interne</label><select id="stInterne"><option value="">— Choisir —</option>${internesOptions(STATE.internes)}</select></div>
        <div class="field"><label>Type de sanction</label>
          <select id="stType"><option>Sanction civique</option><option>Sanction disciplinaire</option><option>Exclusion</option></select>
        </div>
        <div class="field" id="stNiveauWrap" style="display:none;"><label>Niveau (1 à 5)</label>
          <select id="stNiveau">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}${n===5?' — seuil d\'exclusion':''}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Date</label><input type="date" id="stDate" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>Motif</label><textarea id="stMotif"></textarea></div>
      <div id="stAddNote" style="font-size:12px; color:var(--muted); margin-bottom:8px;"></div>
      <div class="btn-row" style="margin-top:2px;"><button class="btn" id="stAdd">Enregistrer la sanction</button></div>
    </div>
    ${admin?`
    <div class="card">
      <h3>Propositions en attente de validation<small>Sanctions disciplinaires et exclusions proposées par l'équipe éducative — à valider ou refuser.</small></h3>
      <div class="table-wrap" id="stPendingWrap"></div>
    </div>
    `:''}
    <div class="card">
      <div class="filters"><input id="stSearch" placeholder="Rechercher un interne..."><select id="stFilter"><option value="">Tous les types</option><option>Sanction civique</option><option>Sanction disciplinaire</option><option>Exclusion</option></select></div>
      <div class="btn-row" style="margin-bottom:12px;"><button class="btn sm ghost" id="stPrint">${ICONS.print}Imprimer ce tableau</button></div>
      <div class="table-wrap" id="stTableWrap"></div>
    </div>
    ${collapsible("Cumul par interne & contrat de comportement", `
      <p style="color:var(--muted); font-size:13px; margin-top:4px;">Nombre de sanctions validées et cumul du niveau d'exclusion. Un cumul ≥ 5 déclenche automatiquement le badge « Sous contrat » ; la Direction peut aussi l'activer manuellement pour un interne qui serait sous contrat sans avoir atteint ce seuil.</p>
      <div class="btn-row" style="margin-bottom:12px;"><button class="btn sm ghost" id="stPrintSummary">${ICONS.print}Imprimer ce récapitulatif</button></div>
      <div class="table-wrap" id="stSummaryWrap"></div>
    `)}
  `;
  function needsApproval(type){ return type!=='Sanction civique' && !admin; }
  function countedSanctions(){ return STATE.sanctions.filter(s=>s.type==='Sanction civique' || s.statut==='validee'); }
  function statutBadge(s){
    if(s.type==='Sanction civique') return '';
    if(s.statut==='proposee') return '<span class="badge amber">En attente Direction</span>';
    if(s.statut==='refusee') return '<span class="badge gray">Refusée</span>';
    return '<span class="badge green">Validée</span>';
  }
  function updateAddUi(){
    const type = document.getElementById('stType').value;
    document.getElementById('stNiveauWrap').style.display = type==='Exclusion' ? '' : 'none';
    const pending = needsApproval(type);
    document.getElementById('stAdd').textContent = pending ? 'Proposer à la Direction' : 'Enregistrer la sanction';
    document.getElementById('stAddNote').textContent = pending ? 'Cette proposition sera soumise à la Direction et ne comptera dans le cumul qu\'une fois validée.' : '';
  }
  document.getElementById('stType').addEventListener('change', updateAddUi);
  updateAddUi();
  document.getElementById('stAdd').onclick=()=>{
    const interneId=document.getElementById('stInterne').value;
    if(!interneId){ showToast('Choisissez un interne'); return; }
    const type=document.getElementById('stType').value;
    const pending = needsApproval(type);
    STATE.sanctions.push({
      id:uid(), interneId, type, niveau: type==='Exclusion'?Number(document.getElementById('stNiveau').value):null,
      date:document.getElementById('stDate').value, motif:document.getElementById('stMotif').value,
      enregistrePar: currentUserName(), statut: pending?'proposee':'validee', valideePar: pending?null:currentUserName(),
    });
    persist('sanctions');
    showToast(pending?'Proposition envoyée à la Direction':'Sanction enregistrée');
    document.getElementById('stMotif').value=''; drawTable(); drawSummary(); drawPending();
  };
  function drawPending(){
    if(!admin) return;
    const wrap = document.getElementById('stPendingWrap');
    if(!wrap) return;
    const pending = STATE.sanctions.filter(s=>s.statut==='proposee').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    wrap.innerHTML = pending.length? `
      <table><thead><tr><th>Date</th><th>Interne</th><th>Type</th><th>Niveau</th><th>Motif</th><th>Proposé par</th><th></th></tr></thead>
      <tbody>${pending.map(r=>`<tr>
        <td>${fmtDate(r.date)}</td><td><span class="link-name" data-open-dossier="${r.interneId}">${nomComplet(getInterne(r.interneId))}</span></td>
        <td>${r.type==='Exclusion'?'<span class="badge red">Exclusion</span>':'<span class="badge amber">Disciplinaire</span>'}</td>
        <td>${r.niveau??'—'}</td><td>${r.motif||'—'}</td><td>${r.enregistrePar||'—'}</td>
        <td><div class="btn-row"><button class="btn sm" data-valider="${r.id}">Valider</button><button class="btn sm ghost" data-refuser="${r.id}">Refuser</button></div></td>
      </tr>`).join('')}</tbody></table>
    ` : `<div class="empty">Aucune proposition en attente.</div>`;
    wrap.querySelectorAll('[data-valider]').forEach(b=>b.addEventListener('click',()=>{
      const s = STATE.sanctions.find(x=>x.id===b.dataset.valider);
      if(!s) return;
      s.statut='validee'; s.valideePar=currentUserName();
      persist('sanctions'); showToast('Sanction validée'); drawPending(); drawTable(); drawSummary();
    }));
    wrap.querySelectorAll('[data-refuser]').forEach(b=>b.addEventListener('click',()=>{
      const s = STATE.sanctions.find(x=>x.id===b.dataset.refuser);
      if(!s) return;
      openModal(`<h3>Refuser cette proposition ?</h3>
        <div class="field"><label>Motif du refus (facultatif)</label><textarea id="refMotif"></textarea></div>
        <div class="btn-row"><button class="btn red" id="confirmRefus">Refuser</button><button class="btn ghost" id="cancelRefus">Annuler</button></div>`);
      document.getElementById('cancelRefus').onclick = closeModal;
      document.getElementById('confirmRefus').onclick = ()=>{
        s.statut='refusee'; s.valideePar=currentUserName(); s.refusMotif=document.getElementById('refMotif').value.trim();
        persist('sanctions'); closeModal(); showToast('Proposition refusée'); drawPending(); drawTable(); drawSummary();
      };
    }));
  }
  function drawTable(){
    const f=document.getElementById('stFilter').value;
    const q=normalizeHeader(document.getElementById('stSearch').value);
    const rows = STATE.sanctions.filter(s=>(!f||s.type===f) && (!q||normalizeHeader(nomComplet(getInterne(s.interneId))).includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    document.getElementById('stTableWrap').innerHTML = rows.length? `
      <table><thead><tr><th>Date</th><th>Interne</th><th>Type</th><th>Statut</th><th>Niveau</th><th>Motif</th><th>Enregistré par</th><th></th></tr></thead>
      <tbody>${rows.map(r=>{
        const canDelete = admin || r.type==='Sanction civique' || (r.statut==='proposee' && r.enregistrePar===currentUserName());
        return `<tr><td>${fmtDate(r.date)}</td><td><span class="link-name" data-open-dossier="${r.interneId}">${nomComplet(getInterne(r.interneId))}</span></td>
        <td>${r.type==='Exclusion'?'<span class="badge red">Exclusion</span>':r.type==='Sanction disciplinaire'?'<span class="badge amber">Disciplinaire</span>':'<span class="badge blue">Civique</span>'}</td>
        <td>${statutBadge(r)}</td>
        <td>${r.niveau??'—'}</td><td>${r.motif||'—'}${r.refusMotif?`<div style="font-size:11px; color:var(--muted);">Motif du refus : ${r.refusMotif}</div>`:''}</td><td>${r.enregistrePar||'—'}</td>
        <td>${canDelete?`<button class="btn sm danger" data-del="${r.id}">${ICONS.trash}</button>`:''}</td></tr>`;
      }).join('')}</tbody></table>
    `: `<div class="empty">Aucune sanction enregistrée.</div>`;
    document.querySelectorAll('#stTableWrap [data-del]').forEach(b=>b.addEventListener('click',()=>{
      STATE.sanctions=STATE.sanctions.filter(x=>x.id!==b.dataset.del); persist('sanctions'); drawTable(); drawSummary(); drawPending();
    }));
  }
  function drawSummary(){
    const counted = countedSanctions();
    const map={};
    counted.forEach(s=>{ if(!map[s.interneId]) map[s.interneId]={count:0,excl:0}; map[s.interneId].count++; if(s.type==='Exclusion') map[s.interneId].excl+=Number(s.niveau||0); });
    const list = STATE.internes.filter(i=>i.statut==='Actif').slice().sort((a,b)=>nomComplet(a).localeCompare(nomComplet(b)));
    document.getElementById('stSummaryWrap').innerHTML = list.length? `
      <table><thead><tr><th>Interne</th><th>École</th><th>Nb sanctions</th><th>Cumul exclusion (/5)</th><th>Sous contrat</th><th>Contrat (décision Direction)</th></tr></thead>
      <tbody>${list.map(i=>{ const m=map[i.id]||{count:0,excl:0}; const cu=Math.min(5,m.excl); const sousContrat = cu>=5 || !!i.souscontrat; return `
        <tr><td><span class="link-name" data-open-dossier="${i.id}">${nomComplet(i)}</span></td><td>${i.ecole||'—'}</td><td>${m.count}</td>
        <td><div class="gauge">${[1,2,3,4,5].map(n=>`<i class="${n<=cu?'on':''}"></i>`).join('')}</div></td>
        <td>${sousContrat?'<span class="badge red">Sous contrat</span>':'<span class="badge gray">—</span>'}</td>
        <td><label class="check-row"><input type="checkbox" class="contrat-toggle" data-id="${i.id}" ${i.souscontrat?'checked':''} ${admin?'':'disabled'}>Contrat</label></td>
        </tr>`;}).join('')}</tbody></table>
    `: `<div class="empty">Aucun interne actif.</div>`;
    document.querySelectorAll('.contrat-toggle').forEach(cb=>cb.addEventListener('change',()=>{
      const it = getInterne(cb.dataset.id);
      if(!it) return;
      it.souscontrat = cb.checked;
      persist('internes');
      showToast(cb.checked?'Marqué sous contrat':'Retiré du contrat');
      drawSummary();
    }));
  }
  document.getElementById('stFilter').addEventListener('change',drawTable);
  document.getElementById('stSearch').addEventListener('input',drawTable);
  document.getElementById('stPrint').onclick = ()=>{
    const f=document.getElementById('stFilter').value;
    const q=normalizeHeader(document.getElementById('stSearch').value);
    const rows = STATE.sanctions.filter(s=>(!f||s.type===f) && (!q||normalizeHeader(nomComplet(getInterne(s.interneId))).includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const body = `<table><thead><tr><th>Date</th><th>Interne</th><th>Type</th><th>Statut</th><th>Niveau</th><th>Motif</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${nomComplet(getInterne(r.interneId))}</td><td>${r.type}</td><td>${r.type==='Sanction civique'?'—':(r.statut==='proposee'?'En attente':r.statut==='refusee'?'Refusée':'Validée')}</td><td>${r.niveau??'—'}</td><td>${r.motif||'—'}</td></tr>`).join('')}</tbody></table>`;
    openPrintWindow('Sanctions'+(f?' — '+f:''), body);
  };
  document.getElementById('stPrintSummary').onclick = ()=>{
    const counted = countedSanctions();
    const map={};
    counted.forEach(s=>{ if(!map[s.interneId]) map[s.interneId]={count:0,excl:0}; map[s.interneId].count++; if(s.type==='Exclusion') map[s.interneId].excl+=Number(s.niveau||0); });
    const list = STATE.internes.filter(i=>i.statut==='Actif').slice().sort((a,b)=>nomComplet(a).localeCompare(nomComplet(b)));
    const body = `<table><thead><tr><th>Interne</th><th>École</th><th>Nb sanctions</th><th>Cumul exclusion (/5)</th><th>Sous contrat</th></tr></thead>
      <tbody>${list.map(i=>{ const m=map[i.id]||{count:0,excl:0}; const cu=Math.min(5,m.excl); const sousContrat = cu>=5 || !!i.souscontrat;
        return `<tr><td>${nomComplet(i)}</td><td>${i.ecole||'—'}</td><td>${m.count}</td><td>${cu}/5</td><td>${sousContrat?'Oui':'Non'}</td></tr>`; }).join('')}</tbody></table>`;
    openPrintWindow('Sanctions — récapitulatif par interne', body);
  };
  drawTable(); drawSummary(); drawPending();
}

/* ============================= ETAGES & CHAMBRES ============================= */

  main.innerHTML = `
    <div class="page-head"><div class="icon-badge">${ICONS.etages}</div><div><h2>Étages & chambres</h2><p>Organisation des étages, chambres et assignation des internes.</p></div></div>
    ${collapsible('Ajouter un étage ou une chambre', `
      <div class="two-col" style="margin-top:4px;">
        <div>
          <h3 style="border:none; padding:0; margin-bottom:10px;">Nouvel étage</h3>
          <div class="field"><label>Nom de l'étage</label><input id="etNom" placeholder="ex : Étage 1"></div>
          <div class="btn-row" style="margin-top:10px;"><button class="btn sm" id="etAdd">Ajouter l'étage</button></div>
        </div>
        <div>
          <h3 style="border:none; padding:0; margin-bottom:10px;">Nouvelle chambre<small>Les chambres commencent par un « I » suivi du numéro de l'étage, ex : I101, I234. Une chambre peut être individuelle, double, ou un appartement jusqu'à 4 places. Une erreur d'étage se corrige ensuite directement dans le tableau ci-dessous, sans rien supprimer.</small></h3>

          <div class="grid-form" style="margin-top:8px;">
            <div class="field"><label>Nom / code de la chambre</label><input id="chNom" placeholder="ex : I101"></div>
            <div class="field"><label>Capacité (places)</label><select id="chCapacite">${[1,2,3,4].map(n=>`<option value="${n}"${n===2?' selected':''}>${n} place${n>1?'s':''}</option>`).join('')}</select></div>
          </div>
          <div class="btn-row" style="margin-top:10px;"><button class="btn sm" id="chAdd">Ajouter la chambre</button></div>
        </div>
      </div>
    `, {open:true})}
    ${collapsible('Assigner un interne à une chambre', `
      <div class="grid-form" style="margin-top:4px;">
        <div class="field"><label>Interne</label><select id="asInterne"></select></div>
        <div class="field"><label>Chambre</label><select id="asChambre"></select></div>
      </div>
      <div class="btn-row" style="margin-top:8px;"><button class="btn sm" id="asAdd">Assigner</button></div>
    `, {open:true})}
    <div class="card">
      <h3>Occupation des chambres<small>Une chambre mise au mauvais étage par erreur ? Changez son étage directement dans la colonne dédiée — les occupants restent assignés, rien n'est perdu. Supprimer une chambre ou un étage libère les internes concernés (ils repassent dans « Internes non assignés » juste en dessous), sans jamais toucher à leur fiche.</small></h3>
      <div id="etTableWrap"></div>
    </div>
    <div class="card">
      <h3>Internes non assignés</h3>
      <div class="table-wrap" id="etUnassignedWrap"></div>
    </div>
    ${collapsible('Trombinoscope', `
      <p style="color:var(--muted); font-size:13px; margin-top:4px;">Photos organisées par étage et chambre — pratique à imprimer et garder sous la main.</p>
      <div class="btn-row" style="margin-bottom:14px;"><button class="btn sm ghost" id="etPrintTrombi">${ICONS.print}Imprimer le trombinoscope</button></div>
      <div id="trombiWrap"></div>
    `)}
  `;
  function occupants(c){ return (c.interneIds||[]).map(id=>getInterne(id)).filter(Boolean); }
  function placesLibres(c){ return Math.max(0, (c.capacite||1) - (c.interneIds||[]).length); }
  function refreshSelects(){
    document.getElementById('chEtage').innerHTML = STATE.etages.map(e=>`<option value="${e.id}">${e.nom}</option>`).join('') || '<option value="">Aucun étage</option>';
    const unassigned = STATE.internes.filter(i=>!STATE.chambres.some(c=>(c.interneIds||[]).includes(i.id)));
    document.getElementById('asInterne').innerHTML = '<option value="">— Choisir —</option>' + internesOptions(unassigned);
    document.getElementById('asChambre').innerHTML = '<option value="">— Choisir —</option>' + STATE.chambres.slice().sort((a,b)=>{
      const ea=STATE.etages.find(e=>e.id===a.etageId), eb=STATE.etages.find(e=>e.id===b.etageId);
      return (ea?ea.nom:'').localeCompare(eb?eb.nom:'') || a.nom.localeCompare(b.nom);
    }).map(c=>{
      const et=STATE.etages.find(e=>e.id===c.etageId);
      const libres = placesLibres(c);
      const label = `${c.nom} (${et?et.nom:'—'}) — ${(c.interneIds||[]).length}/${c.capacite||1} occupée${(c.interneIds||[]).length>1?'s':''}${libres<=0?' — complet':''}`;
      return `<option value="${c.id}" ${libres<=0?'disabled':''}>${label}</option>`;
    }).join('');
  }
  document.getElementById('etAdd').onclick=()=>{
    const nom=document.getElementById('etNom').value.trim();
    if(!nom){ showToast('Nom requis'); return; }
    STATE.etages.push({id:uid(), nom}); persist('etages'); document.getElementById('etNom').value=''; refreshSelects(); drawTables(); showToast('Étage ajouté');
  };
  document.getElementById('chAdd').onclick=()=>{
    const etageId=document.getElementById('chEtage').value, nom=document.getElementById('chNom').value.trim();
    const capacite=Number(document.getElementById('chCapacite').value)||1;
    if(!etageId||!nom){ showToast('Étage et nom requis'); return; }
    STATE.chambres.push({id:uid(), etageId, nom, capacite, interneIds:[]});
    persist('chambres'); document.getElementById('chNom').value=''; refreshSelects(); drawTables(); showToast('Chambre ajoutée');
  };
  document.getElementById('asAdd').onclick=()=>{
    const interneId=document.getElementById('asInterne').value, chambreId=document.getElementById('asChambre').value;
    if(!interneId||!chambreId){ showToast('Interne et chambre requis'); return; }
    const c=STATE.chambres.find(c=>c.id===chambreId);
    if(!c || placesLibres(c)<=0){ showToast('Cette chambre est complète'); return; }
    c.interneIds = [...(c.interneIds||[]), interneId];
    persist('chambres'); refreshSelects(); drawTables(); showToast('Interne assigné');
  };
  function removeEtageCascade(etageId){
    const chambreIds = new Set(STATE.chambres.filter(c=>c.etageId===etageId).map(c=>c.id));
    STATE.chambres = STATE.chambres.filter(c=>!chambreIds.has(c.id));
    STATE.etages = STATE.etages.filter(e=>e.id!==etageId);
    persist('etages'); persist('chambres'); refreshSelects(); drawTables(); showToast('Étage supprimé');
  }
  function removeChambre(chambreId){
    STATE.chambres = STATE.chambres.filter(c=>c.id!==chambreId);
    persist('chambres'); refreshSelects(); drawTables(); showToast('Chambre supprimée');
  }
  function chambreRow(c){
    const occ = occupants(c);
    return `<tr>
      <td class="mono">${c.nom}</td>
      <td><select class="ch-etage-edit" data-chambre="${c.id}"><option value="">— Aucun (orpheline) —</option>${STATE.etages.map(e2=>`<option value="${e2.id}"${e2.id===c.etageId?' selected':''}>${e2.nom}</option>`).join('')}</select></td>
      <td><select class="ch-cap-edit" data-chambre="${c.id}">${[1,2,3,4].map(n=>`<option value="${n}"${n===(c.capacite||1)?' selected':''}>${n} place${n>1?'s':''}</option>`).join('')}</select></td>
      <td>${occ.length? occ.map(i=>`<span class="badge blue" style="margin:0 4px 4px 0;"><span class="link-name" data-open-dossier="${i.id}">${nomComplet(i)}</span> <span data-unassign-one="${c.id}|${i.id}" style="cursor:pointer; font-weight:700;" title="Retirer">×</span></span>`).join('') : '<span class="badge gray">Vide</span>'}</td>
      <td><button class="btn sm danger" data-del-chambre="${c.id}">${ICONS.trash}</button></td>
    </tr>`;
  }
  function drawTables(){
    const orphanes = STATE.chambres.filter(c=>!STATE.etages.some(e=>e.id===c.etageId));
    const orphanBlock = orphanes.length? `
      <div class="card" style="background:var(--red-light); border-color:var(--red); margin-bottom:16px;">
        <h3 style="color:var(--red-dark);">⚠ ${orphanes.length} chambre${orphanes.length>1?'s':''} sans étage valide</h3>
        <p style="font-size:13px; margin:0 0 12px;">Ces chambres pointent vers un étage qui n'existe plus (probablement supprimé entre-temps). Choisissez-leur un étage dans le menu ci-dessous pour les récupérer, ou supprimez-les si elles ne servent plus.</p>
        <table><thead><tr><th>Chambre</th><th>Étage</th><th>Capacité</th><th>Occupants</th><th></th></tr></thead>
        <tbody>${orphanes.map(chambreRow).join('')}</tbody></table>
      </div>
    ` : '';
    document.getElementById('etTableWrap').innerHTML = orphanBlock + (STATE.etages.length? STATE.etages.map(e=>{
      const chambres = STATE.chambres.filter(c=>c.etageId===e.id);
      const occCount = chambres.reduce((a,c)=>a+(c.interneIds||[]).length, 0);
      const summaryLabel = `${e.nom} — ${chambres.length} chambre${chambres.length>1?'s':''}${occCount?', '+occCount+' occupant'+(occCount>1?'s':''):''}`;
      const body = `
        <div class="btn-row" style="margin-bottom:10px;"><button class="btn sm danger" data-del-etage="${e.id}">${ICONS.trash} Supprimer l'étage</button></div>
        ${chambres.length? `
          <table><thead><tr><th>Chambre</th><th>Étage</th><th>Capacité</th><th>Occupants</th><th></th></tr></thead>
          <tbody>${chambres.map(chambreRow).join('')}</tbody></table>
        ` : `<div class="empty">Aucune chambre sur cet étage.</div>`}`;
      return collapsibleSub(summaryLabel, body, {open:true});
    }).join('') : `<div class="empty">Aucun étage créé pour le moment.</div>`);

    document.querySelectorAll('.ch-etage-edit').forEach(sel=>sel.addEventListener('change',()=>{
      const c = STATE.chambres.find(c=>c.id===sel.dataset.chambre);
      if(!c) return;
      c.etageId = sel.value; persist('chambres'); refreshSelects(); drawTables(); showToast('Chambre déplacée — les occupants restent assignés');
    }));
    document.querySelectorAll('.ch-cap-edit').forEach(sel=>sel.addEventListener('change',()=>{
      const c = STATE.chambres.find(c=>c.id===sel.dataset.chambre);
      if(!c) return;
      const newCap = Number(sel.value)||1;
      if(newCap < (c.interneIds||[]).length){
        showToast('Cette chambre compte déjà '+(c.interneIds||[]).length+' occupant(s) : retirez-en avant de réduire la capacité');
        sel.value = c.capacite||1;
        return;
      }
      c.capacite = newCap; persist('chambres'); refreshSelects(); showToast('Capacité mise à jour');
    }));
    document.querySelectorAll('[data-unassign-one]').forEach(b=>b.addEventListener('click',()=>{
      const [chambreId, interneId] = b.dataset.unassignOne.split('|');
      const c = STATE.chambres.find(c=>c.id===chambreId);
      if(!c) return;
      c.interneIds = (c.interneIds||[]).filter(id=>id!==interneId);
      persist('chambres'); refreshSelects(); drawTables(); showToast('Interne retiré de la chambre');
    }));
    document.querySelectorAll('[data-del-chambre]').forEach(b=>b.addEventListener('click',()=>{
      const c = STATE.chambres.find(c=>c.id===b.dataset.delChambre);
      if(!c) return;
      const occ = occupants(c);
      openModal(`<h3>Supprimer la chambre ${c.nom} ?</h3>
        <p>${occ.length? `Cette chambre contient ${occ.length} interne(s) (${occ.map(nomComplet).join(', ')}), qui seront libéré(s) et redeviendront non assignés.` : 'Cette action est irréversible.'}</p>
        <div class="btn-row"><button class="btn red" id="confirmDelCh">Supprimer</button><button class="btn ghost" id="cancelDelCh">Annuler</button></div>`);
      document.getElementById('cancelDelCh').onclick = closeModal;
      document.getElementById('confirmDelCh').onclick = ()=>{ closeModal(); removeChambre(c.id); };
    }));
    document.querySelectorAll('[data-del-etage]').forEach(b=>b.addEventListener('click',()=>{
      const e = STATE.etages.find(e=>e.id===b.dataset.delEtage);
      if(!e) return;
      const chambres = STATE.chambres.filter(c=>c.etageId===e.id);
      const occCount = chambres.reduce((a,c)=>a+(c.interneIds||[]).length, 0);
      openModal(`<h3>Supprimer l'étage ${e.nom} ?</h3>
        <p>${chambres.length? `Cet étage contient ${chambres.length} chambre(s)${occCount?`, avec ${occCount} interne(s) actuellement assigné(s)`:''}. Tout sera supprimé et les internes concernés redeviendront non assignés.` : 'Cette action est irréversible.'}</p>
        <div class="btn-row"><button class="btn red" id="confirmDelEt">Supprimer</button><button class="btn ghost" id="cancelDelEt">Annuler</button></div>`);
      document.getElementById('cancelDelEt').onclick = closeModal;
      document.getElementById('confirmDelEt').onclick = ()=>{ closeModal(); removeEtageCascade(e.id); };
    }));

    const unassigned = STATE.internes.filter(i=>!STATE.chambres.some(c=>(c.interneIds||[]).includes(i.id)));
    document.getElementById('etUnassignedWrap').innerHTML = unassigned.length? `
      <table><thead><tr><th>Interne</th><th>École</th><th>Statut</th></tr></thead>
      <tbody>${unassigned.map(i=>`<tr><td>${nomComplet(i)}</td><td>${i.ecole||'—'}</td><td>${badgeStatut(i.statut)}</td></tr>`).join('')}</tbody></table>
    `: `<div class="empty">Tous les internes sont assignés à une chambre.</div>`;
    drawTrombi();
  }
  function trombiGroups(){
    const groups = STATE.etages.map(e=>({
      label: e.nom,
      internes: STATE.chambres.filter(c=>c.etageId===e.id).flatMap(c=>occupants(c).map(i=>({i, room:c.nom})))
    })).filter(g=>g.internes.length);
    const assignedIds = new Set(STATE.chambres.flatMap(c=>c.interneIds||[]));
    const unassigned = STATE.internes.filter(i=>!assignedIds.has(i.id)).map(i=>({i, room:null}));
    if(unassigned.length) groups.push({label:'Non assignés', internes:unassigned});
    return groups;
  }
  function drawTrombi(){
    const groups = trombiGroups();
    const wrap = document.getElementById('trombiWrap');
    if(!groups.length){ wrap.innerHTML = `<div class="empty">Aucun interne à afficher.</div>`; return; }
    const noDroitCount = groups.flatMap(g=>g.internes).filter(({i})=>i.droitImage==='Non').length;
    wrap.innerHTML = (noDroitCount?`<div style="background:var(--red-light); color:var(--red-dark); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:12.5px;">⚠ ${noDroitCount} interne(s) sans droit à l'image dans cette sélection — leur photo est masquée ci-dessous et à l'impression.</div>`:'') + groups.map(g=>`
      <label style="display:block; margin:14px 0 8px;">${g.label} (${g.internes.length})</label>
      <div class="gallery-grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr));">
        ${g.internes.map(({i,room})=>{
          const noDroit = i.droitImage==='Non';
          return `
          <div style="text-align:center;">
            <div class="row-avatar" id="trombi-${i.id}" style="width:76px; height:76px; margin:0 auto 6px; font-size:22px; border-radius:14px; ${noDroit?'background:var(--red-light); color:var(--red-dark); border:2px solid var(--red);':''}">${noDroit?ICONS.lock:initials(i)}</div>
            <div style="font-size:11.5px; font-weight:700; line-height:1.2;">${nomComplet(i)}</div>
            ${noDroit?`<div style="font-size:10px; color:var(--red-dark); font-weight:700;">Pas de droit à l'image</div>`:room?`<div style="font-size:10.5px; color:var(--muted);" class="mono">${room}</div>`:''}
          </div>
        `;}).join('')}
      </div>
    `).join('');
    const allIds = groups.flatMap(g=>g.internes).filter(({i})=>i.droitImage!=='Non').map(({i})=>i.id);
    getPhotosThrottled(allIds, (id,uri)=>{
      const el = document.getElementById('trombi-'+id);
      if(el) el.innerHTML = `<img src="${uri}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:14px;">`;
    });
  }
  document.getElementById('etPrintTrombi').onclick = async ()=>{
    const groups = trombiGroups();
    const noDroitCount = groups.flatMap(g=>g.internes).filter(({i})=>i.droitImage==='Non').length;
    const allIds = groups.flatMap(g=>g.internes).filter(({i})=>i.droitImage!=='Non').map(({i})=>i.id);
    const photoMap = {};
    await getPhotosThrottled(allIds, (id,uri)=>{ photoMap[id]=uri; }, 4);
    const body = (noDroitCount?`<div class="section-title" style="color:#B3261E;">⚠ ${noDroitCount} interne(s) sans droit à l'image — photo volontairement masquée ci-dessous</div>`:'') + groups.map(g=>`
      <div class="section-title">${g.label}</div>
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-bottom:10px;">
        ${g.internes.map(({i,room})=>{
          const noDroit = i.droitImage==='Non';
          return `
          <div style="width:110px; text-align:center;">
            ${noDroit? `<div style="width:90px; height:90px; border-radius:10px; border:2px solid #B3261E; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold; color:#B3261E; margin:0 auto; text-align:center; padding:4px;">Pas de droit à l'image</div>`
              : photoMap[i.id]? `<img src="${photoMap[i.id]}" style="width:90px; height:90px; object-fit:cover; border-radius:10px; border:1px solid #ccc;">` : `<div style="width:90px; height:90px; border-radius:10px; border:1px solid #ccc; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; color:#888; margin:0 auto;">${initials(i)}</div>`}
            <div style="font-size:11.5px; font-weight:bold; margin-top:5px;">${nomComplet(i)}</div>
            ${room?`<div style="font-size:10px; color:#666;">${room}</div>`:''}
          </div>
        `;}).join('')}
      </div>
    `).join('');
    openPrintWindow('Trombinoscope — Internat', body);
  };
  refreshSelects(); drawTables();
}

/* ============================= PRESENCES ============================= */
function renderPresences(main){
  let activeEtage = 'all';
  const STATUS_ORDER = ['absent','present','na'];
  main.innerHTML = `
    <div class="page-head"><div class="icon-badge">${ICONS.presences}</div><div><h2>Présences</h2><p>Appel aux repas — cliquez sur un interne pour faire défiler son statut (absent → présent → non concerné). Une carte en pointillés = pas encore vérifiée aujourd'hui.</p></div></div>
    <div class="card">
      <div class="grid-form">
        <div class="field"><label>Date</label><input type="date" id="pDate" value="${todayISO()}"></div>
        <div class="field"><label>Repas</label><select id="pRepas"><option>Petit-déjeuner</option><option>Dîner</option><option>Goûter</option><option>Souper</option></select></div>
        <div class="field" style="grid-column:span 2;"><label>Rechercher un nom</label><input id="pSearch" placeholder="Rechercher..."></div>
      </div>
    </div>
    <div class="card">
      <div class="type-tabs" id="pEtageTabs"></div>
      <div class="stats-row" id="pStatsRow"></div>
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="btn sm" id="pAllPresent">${ICONS.presences||''} Tout cocher présent (sélection)</button>
        <button class="btn sm ghost" id="pAllReset">Tout remettre à absent</button>
      </div>
      <div class="presence-grid" id="pGrid"></div>
    </div>
    ${collapsible("Historique (par jour, par mois)", `
      <p style="color:var(--muted); font-size:13px; margin-top:4px;">Pour un jour précis : changez simplement la date en haut de page — les statuts déjà enregistrés ce jour-là s'affichent. Pour une vue d'ensemble sur une période :</p>
      <div class="field" style="max-width:220px;"><label>Mois</label><input type="month" id="pHistMonth" value="${todayISO().slice(0,7)}"></div>
      <div class="table-wrap" id="pHistWrap" style="margin-top:10px;"></div>
    `)}
    ${collapsible("Récapitulatif texte", `
      <p style="color:var(--muted); font-size:13px; margin-top:4px;">Liste texte — pratique à relire d'un coup d'œil ou à imprimer.</p>
      <div class="btn-row" style="margin-bottom:12px;"><button class="btn sm ghost" id="pPrint">${ICONS.print}Imprimer / exporter cette liste</button></div>
      <div class="three-col" id="pSummaryWrap"></div>
    `)}
  `;
  function group(createIfMissing){
    const date=document.getElementById('pDate').value, repas=document.getElementById('pRepas').value;
    let g = STATE.presences.find(p=>p.date===date && p.repas===repas);
    if(!g && createIfMissing){ g={id:uid(), date, repas, statuts:{}}; STATE.presences.push(g); }
    if(g && !g.statuts){
      // Migrate older records that only stored a plain list of "present" ids.
      g.statuts = {};
      (g.internes||[]).forEach(id=>{ g.statuts[id] = 'present'; });
    }
    return g;
  }
  function statusOf(g, id){
    const v = g && g.statuts[id];
    if(!v) return 'absent';
    return typeof v === 'object' ? v.v : v;
  }
  function statusMeta(g, id){
    const v = g && g.statuts[id];
    return (v && typeof v === 'object') ? v : null;
  }
  function chambreOf(id){ return STATE.chambres.find(c=>(c.interneIds||[]).includes(id)); }
  function studentsFor(key){
    if(key==='all') return STATE.internes;
    if(key==='none') return STATE.internes.filter(i=>!chambreOf(i.id));
    return STATE.internes.filter(i=>{ const c=chambreOf(i.id); return c && c.etageId===key; });
  }
  function currentList(){
    const q = document.getElementById('pSearch').value.trim().toLowerCase();
    let list = studentsFor(activeEtage);
    if(q) list = list.filter(i=>nomComplet(i).toLowerCase().includes(q));
    return list.slice().sort((a,b)=>nomComplet(a).localeCompare(nomComplet(b)));
  }
  function cycleStatus(id){
    const g = group(true);
    const cur = statusOf(g, id);
    const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
    // Always keep a record, even for "absent" — otherwise "checked and marked
    // absent" and "nobody has looked at this person yet" look identical, which
    // is exactly what made the team unsure whether the appel had really run.
    g.statuts[id] = { v: next, par: currentUserName(), ts: Date.now() };
    persist('presences');
    drawAll();
    const label = next==='present'?'Présent':next==='na'?'Non concerné':'Absent';
    showToast(`${nomComplet(getInterne(id))} — ${label} ✓`);
    const card = document.querySelector(`.presence-card[data-id="${id}"]`);
    if(card){ card.classList.remove('just-updated'); void card.offsetWidth; card.classList.add('just-updated'); }
  }
  function setAllStatus(status){
    const g = group(true);
    currentList().forEach(i=>{
      g.statuts[i.id] = { v: status, par: currentUserName(), ts: Date.now() };
    });
    persist('presences');
    drawAll();
    showToast('Statut mis à jour pour la sélection ✓');
  }
  function drawTabs(){
    const g = group(false);
    const tabs = [{key:'all', label:'Tous'}, ...STATE.etages.map(e=>({key:e.id, label:e.nom})), {key:'none', label:'Non assignés'}];
    document.getElementById('pEtageTabs').innerHTML = tabs.map(t=>{
      const students = studentsFor(t.key);
      const checked = students.filter(i=>statusMeta(g,i.id)).length;
      return `<button class="type-tab ${activeEtage===t.key?'active':''}" data-etage="${t.key}">${t.label} (${checked}/${students.length})</button>`;
    }).join('');
    document.querySelectorAll('#pEtageTabs .type-tab').forEach(b=>b.addEventListener('click',()=>{
      activeEtage = b.dataset.etage; drawAll();
    }));
  }
  function drawGrid(){
    const g = group(false);
    const list = currentList();
    const presents = list.filter(i=>statusOf(g,i.id)==='present').length;
    const nas = list.filter(i=>statusOf(g,i.id)==='na').length;
    const checked = list.filter(i=>statusMeta(g,i.id)).length;
    document.getElementById('pStatsRow').innerHTML = `
      <div class="stat-card" style="--accent:var(--blue);"><div class="n">${checked} / ${list.length}</div><div class="l">Vérifiés (sélection)</div></div>
      <div class="stat-card" style="--accent:var(--green);"><div class="n">${presents}</div><div class="l">Présents (sélection)</div></div>
      <div class="stat-card" style="--accent:var(--amber);"><div class="n">${nas}</div><div class="l">Non concernés (sélection)</div></div>
      <div class="stat-card" style="--accent:var(--red);"><div class="n">${list.length - presents - nas}</div><div class="l">Absents (sélection)</div></div>
    `;
    document.getElementById('pGrid').innerHTML = list.length? list.map(i=>{
      const c = chambreOf(i.id);
      const st = statusOf(g, i.id);
      const meta = statusMeta(g, i.id);
      const cls = st==='present'?'present':st==='na'?'na':meta?'absent-checked':'unchecked';
      const icon = st==='present'?'✓':st==='na'?'–':meta?'×':'';
      const stLabel = st==='present'?'Présent':st==='na'?'Non concerné':meta?'Absent (vérifié)':'Pas encore vérifié';
      const metaLine = meta? `<div class="p-meta">${meta.par}, ${new Date(meta.ts).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})}</div>` : `<div class="p-meta">À faire</div>`;
      return `<div class="presence-card ${cls}" data-id="${i.id}" title="${stLabel} — cliquer pour changer">
        <div class="p-check">${icon}</div>
        <div class="p-avatar" id="pavatar-${i.id}">${initials(i)}</div>
        <div class="p-name">${nomComplet(i)}</div>
        <div class="p-room">${c?c.nom:'—'}</div>
        ${metaLine}
      </div>`;
    }).join('') : `<div class="empty">Aucun interne à afficher.</div>`;
    document.querySelectorAll('.presence-card').forEach(card=>card.addEventListener('click',()=>cycleStatus(card.dataset.id)));
    getPhotosThrottled(list.map(i=>i.id), (id,uri)=>{
      const el = document.getElementById('pavatar-'+id);
      if(el) el.innerHTML = `<img src="${uri}" alt="">`;
    });
  }
  function drawSummary(){
    const g = group(false);
    const list = currentList();
    const presents = list.filter(i=>statusOf(g,i.id)==='present');
    const nas = list.filter(i=>statusOf(g,i.id)==='na');
    const absents = list.filter(i=>statusOf(g,i.id)==='absent');
    const col = (title, items, color) => `
      <div>
        <label style="display:block; margin-bottom:8px;">${title} (${items.length})</label>
        ${items.length? `<ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9; ${color?'color:'+color+';':''}">${items.map(i=>`<li>${nomComplet(i)}</li>`).join('')}</ul>` : `<div class="empty">Aucun</div>`}
      </div>`;
    document.getElementById('pSummaryWrap').innerHTML =
      col('Présents', presents) + col('Non concernés', nas, 'var(--amber)') + col('Absents', absents, 'var(--muted)');
  }
  function drawHistory(){
    const monthInput = document.getElementById('pHistMonth');
    if(!monthInput) return;
    const month = monthInput.value;
    const groups = STATE.presences.filter(g=>(g.date||'').startsWith(month));
    const list = currentList();
    const rows = list.map(i=>{
      let present=0, na=0, absent=0, lastMeta=null;
      groups.forEach(g=>{
        const st = statusOf(g, i.id);
        if(st==='present') present++; else if(st==='na') na++; else absent++;
        const meta = statusMeta(g, i.id);
        if(meta && (!lastMeta || meta.ts > lastMeta.ts)) lastMeta = meta;
      });
      return { i, present, na, absent, lastMeta };
    });
    document.getElementById('pHistWrap').innerHTML = (groups.length && rows.length) ? `
      <p style="font-size:12px; color:var(--muted); margin-bottom:8px;">${groups.length} appel(s) enregistré(s) ce mois-ci pour la sélection actuelle (onglet étage + recherche du haut).</p>
      <table><thead><tr><th>Interne</th><th>Présent</th><th>Non concerné</th><th>Absent</th><th>Dernière modification</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><span class="link-name" data-open-dossier="${r.i.id}">${nomComplet(r.i)}</span></td>
        <td>${r.present}</td><td>${r.na}</td><td>${r.absent}</td>
        <td style="font-size:12px; color:var(--muted);">${r.lastMeta? `${new Date(r.lastMeta.ts).toLocaleDateString('fr-BE')} ${new Date(r.lastMeta.ts).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})} — ${r.lastMeta.par}` : '—'}</td>
      </tr>`).join('')}</tbody></table>
    ` : `<div class="empty">Aucun appel enregistré pour ce mois.</div>`;
  }
  function drawAll(){ drawTabs(); drawGrid(); drawSummary(); drawHistory(); }
  document.getElementById('pAllPresent').addEventListener('click', ()=>setAllStatus('present'));
  document.getElementById('pAllReset').addEventListener('click', ()=>setAllStatus('absent'));
  document.getElementById('pPrint').onclick = ()=>{
    const g = group(false);
    const list = currentList();
    const date = document.getElementById('pDate').value, repas = document.getElementById('pRepas').value;
    const label = st => st==='present'?'Présent':st==='na'?'Non concerné':'Absent';
    const presents = list.filter(i=>statusOf(g,i.id)==='present').length;
    const body = `
      <div class="section-title">${fmtDate(date)} — ${repas}</div>
      <table><thead><tr><th>Interne</th><th>Chambre</th><th>Statut</th></tr></thead>
      <tbody>${list.map(i=>{ const c=chambreOf(i.id);
        return `<tr><td>${nomComplet(i)}</td><td>${c?c.nom:'—'}</td><td>${label(statusOf(g,i.id))}</td></tr>`;
      }).join('')}</tbody></table>
      <div class="section-title">${presents} présent(s) sur ${list.length}</div>
    `;
    openPrintWindow('Présences — '+repas+' du '+fmtDate(date), body);
  };
  ['pDate','pRepas'].forEach(id=>document.getElementById(id).addEventListener('change', drawAll));
  document.getElementById('pSearch').addEventListener('input', drawAll);
  document.getElementById('pHistMonth').addEventListener('change', drawHistory);

/* ============================= JOURNAL DE BORD ============================= */
const JOURNAL_TYPES = [{key:'Comportement', color:'blue'}, {key:'Communication parents', color:'green'}, {key:'Suivi scolaire', color:'violet'}];
const JOURNAL_CONTACT_LABEL = { 'Communication parents':'Contact (parent, tuteur...)', 'Suivi scolaire':'Contact (professeur, matière...)' };
function renderJournal(main){
  let activeType = '';
  main.innerHTML = `
    <div class="page-head"><div class="icon-badge">${ICONS.journal}</div><div><h2>Journal de bord</h2><p>Comptes rendus de comportement, communication avec les parents et suivi scolaire.</p></div></div>
    <div class="card">
      <h3>Nouveau compte rendu</h3>
      <div class="grid-form">
        <div class="field"><label>Type</label>
          <select id="jType">${JOURNAL_TYPES.map(t=>`<option>${t.key}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Date</label><input type="date" id="jDate" value="${todayISO()}"></div>
        <div class="field"><label>Équipe / éducateur</label><input id="jEquipe" value="${currentUserName()}"></div>
        <div class="field"><label>Interne(s) concerné(s) (facultatif)</label>
          <select id="jInternes" multiple size="3">${internesOptions(STATE.internes)}</select>
        </div>
      </div>
      <div class="field" id="jContactWrap" style="display:none;"><label id="jContactLabel">Contact</label><input id="jContact" placeholder="Ex : M. Dupont, professeur de mathématiques"></div>
      <div class="field"><label>Compte rendu</label><textarea id="jTexte" style="min-height:90px;" placeholder="Sujet abordé et suite donnée."></textarea></div>
      <div class="btn-row" style="margin-top:10px;"><button class="btn" id="jAdd">Enregistrer le compte rendu</button></div>
    </div>
    <div class="card">
      <div class="filters"><input id="jSearch" placeholder="Rechercher un interne..."></div>
      <div class="type-tabs" id="jTypeTabs"></div>
      <div id="jList"></div>
    </div>
  `;
  function updateContactField(){
    const type = document.getElementById('jType').value;
    const label = JOURNAL_CONTACT_LABEL[type];
    document.getElementById('jContactWrap').style.display = label ? '' : 'none';
    if(label) document.getElementById('jContactLabel').textContent = label;
  }
  document.getElementById('jType').addEventListener('change', updateContactField);
  updateContactField();
  document.getElementById('jAdd').onclick=()=>{
    const texte=document.getElementById('jTexte').value.trim();
    if(!texte){ showToast('Le compte rendu ne peut pas être vide'); return; }
    const sel=[...document.getElementById('jInternes').selectedOptions].map(o=>o.value);
    STATE.journal.push({id:uid(), type:document.getElementById('jType').value, date:document.getElementById('jDate').value, equipe:document.getElementById('jEquipe').value, contact:document.getElementById('jContact').value.trim(), internes:sel, texte});
    persist('journal'); document.getElementById('jTexte').value=''; document.getElementById('jContact').value=''; drawAll(); showToast('Compte rendu enregistré');
  };
  function journalTypeBadge(t){
    const info = JOURNAL_TYPES.find(x=>x.key===t) || JOURNAL_TYPES[0];
    return `<span class="badge ${info.color}">${info.key}</span>`;
  }
  function drawTabs(){
    const tabs=[{key:'',label:'Tous'}, ...JOURNAL_TYPES.map(t=>({key:t.key,label:t.key}))];
    document.getElementById('jTypeTabs').innerHTML = tabs.map(t=>{
      const count = t.key? STATE.journal.filter(r=>r.type===t.key).length : STATE.journal.length;
      return `<button class="type-tab ${activeType===t.key?'active':''}" data-type="${t.key}">${t.label} (${count})</button>`;
    }).join('');
    document.querySelectorAll('#jTypeTabs .type-tab').forEach(b=>b.addEventListener('click',()=>{ activeType=b.dataset.type; drawAll(); }));
  }
  function entryHtml(r){
    return `
      <div style="border-bottom:1px solid var(--line); padding:12px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
          <div><b>${fmtDate(r.date)}</b> ${journalTypeBadge(r.type||'Comportement')} <span style="color:var(--muted);">— ${r.equipe||'Équipe non renseignée'}</span></div>
          <button class="btn sm danger" data-del="${r.id}">${ICONS.trash}</button>
        </div>
        ${r.internes.length?`<div style="margin-bottom:5px;">${r.internes.map(id=>`<span class="badge blue link-name" data-open-dossier="${id}" style="margin-right:5px;">${nomComplet(getInterne(id))}</span>`).join('')}</div>`:''}
        ${r.contact?`<div style="font-size:12.5px; color:var(--muted); margin-bottom:3px;"><b>${JOURNAL_CONTACT_LABEL[r.type]||'Contact'} :</b> ${r.contact}</div>`:''}
        <div style="font-size:13.5px;">${r.texte}</div>
      </div>
    `;
  }
  function drawList(){
    const q = normalizeHeader(document.getElementById('jSearch').value);
    const rows = STATE.journal.slice().filter(r=>(!activeType||r.type===activeType) && (!q || (r.internes||[]).some(id=>normalizeHeader(nomComplet(getInterne(id))).includes(q)))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(!rows.length){ document.getElementById('jList').innerHTML = `<div class="empty">Aucun compte rendu enregistré.</div>`; return; }
    // Grouped by month so the list stays short at a glance even after years
    // of use — only the most recent month is open by default.
    const groups = [];
    rows.forEach(r=>{
      const key = (r.date||'').slice(0,7); // "YYYY-MM"
      let g = groups.find(x=>x.key===key);
      if(!g){ g = { key, label: key? new Date(key+'-01T00:00:00').toLocaleDateString('fr-BE',{month:'long', year:'numeric'}) : 'Date inconnue', rows:[] }; groups.push(g); }
      g.rows.push(r);
    });
    document.getElementById('jList').innerHTML = groups.map((g,idx)=>collapsibleSub(
      `${g.label.charAt(0).toUpperCase()+g.label.slice(1)} (${g.rows.length})`,
      g.rows.map(entryHtml).join(''),
      { open: idx===0 }
    )).join('');
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      STATE.journal=STATE.journal.filter(x=>x.id!==b.dataset.del); persist('journal'); drawAll();
    }));
  }
  function drawAll(){ drawTabs(); drawList(); }
  document.getElementById('jSearch').addEventListener('input', drawList);
  drawAll();
}

/* ============================= RAPPORT DE GARDE ============================= */
// A shift-end summary an educator fills in once, instead of having to open
// every intern's file. Pulls together anything already logged for the day
// (sanctions, journal, infirmerie, sorties) as a read-only recap, then lets
// the educator add a short note per étage plus a general note for common
// areas (étude, réfectoire...), and publishes it straight to the Direction.
function gardeDayData(date){
  return {
    sanctions: STATE.sanctions.filter(s=>s.date===date),
    journalEntries: STATE.journal.filter(j=>j.date===date),
    infirmerie: STATE.infirmerie.filter(i=>i.date===date),
    sortiesS: STATE.sortiesSemaine.filter(s=>s.date===date),
  };
}
function gardeAutoSummaryHTML(date){
  const d = gardeDayData(date);
  const rows = [
    {label:'Sanctions', items: d.sanctions.map(s=>`${nomComplet(getInterne(s.interneId))} — ${s.type}${s.motif?' : '+s.motif:''}`)},
    {label:'Journal de bord', items: d.journalEntries.map(j=>`${j.type} — ${(j.texte||'').slice(0,90)}${(j.texte||'').length>90?'…':''}`)},
    {label:'Carnet infirmerie', items: d.infirmerie.map(i=>`${nomComplet(getInterne(i.interneId))} — ${i.type}${i.description?' : '+i.description:''}`)},
    {label:'Sorties de la semaine', items: d.sortiesS.map(s=>`${nomComplet(getInterne(s.interneId))} — ${s.motif||'—'} (${s.statut||'—'})`)},
  ];
  const any = rows.some(r=>r.items.length);
  if(!any) return `<div class="empty">Rien d'enregistré ailleurs dans l'application pour cette date.</div>`;
  return rows.filter(r=>r.items.length).map(r=>`
    <div style="margin-bottom:10px;">
      <label style="display:block; margin-bottom:4px;">${r.label} (${r.items.length})</label>
      <ul style="margin:0; padding-left:18px; font-size:12.5px; line-height:1.8;">${r.items.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>`).join('');
}
function renderGarde(main){
  main.innerHTML = `

      showToast('Ajoutez au moins une remarque (un étage ou les communs) avant d\'envoyer');

  function etageName(id){ const e = STATE.etages.find(x=>x.id===id); return e ? e.nom : 'Étage supprimé'; }
  function gardeCard(r){
    const canDelete = isAdmin() || r.educateur===currentUserName();

    const rows = STATE.rapportsGarde.slice().filter(r=>!f||r.date===f).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
    document.getElementById('gList').innerHTML = rows.length ? rows.map(gardeCard).join('') : `<div class="empty">Aucun rapport de garde pour le moment.</div>`;
    document.querySelectorAll('#gList [data-del]').forEach(b=>b.addEventListener('click',()=>{
      STATE.rapportsGarde = STATE.rapportsGarde.filter(x=>x.id!==b.dataset.del); persist('rapportsGarde'); drawList();
    }));
    document.querySelectorAll('#gList [data-print]').forEach(b=>b.addEventListener('click',()=>{
      const r = STATE.rapportsGarde.find(x=>x.id===b.dataset.print);

      const etageRows = Object.keys(r.etages||{}).map(eid=>`<p><b>${etageName(eid)}</b><br>${r.etages[eid]}</p>`).join('');

  document.getElementById('gFilterDate').addEventListener('change', drawList);
  drawList();
}

/* ============================= GALERIE PHOTOS ============================= */
function renderPhotos(main){
  const admin = isAdmin();
  const noDroitList = STATE.internes.filter(i=>i.droitImage==='Non' && i.statut==='Actif');
  main.innerHTML = `
    <div class="page-head"><div class="icon-badge">${ICONS.photos}</div><div><h2>Galerie photos</h2><p>Un espace partagé pour déposer et récupérer des photos — sorties, événements, vie quotidienne.</p></div></div>
    ${noDroitList.length?`<div class="card" style="background:var(--red-light); border-color:var(--red);">
      <h3 style="color:var(--red-dark);">⚠ Droit à l'image à vérifier avant de publier ou partager</h3>
      <p style="font-size:13px; margin:0;">Ces internes n'ont pas le droit à l'image (voir leur fiche) — vérifiez qu'ils n'apparaissent pas de façon reconnaissable avant de déposer une photo ici ou de la partager en dehors de l'application : <b>${noDroitList.map(nomComplet).join(', ')}</b>.</p>
    </div>`:''}
    <div class="card">
      <h3>Déposer des photos<small>JPEG ou PNG, plusieurs à la fois. Elles sont compressées automatiquement avant l'envoi. Pensez à supprimer les anciennes de temps en temps pour garder de la place.</small></h3>
      <label class="btn photo-upload-btn">Choisir des photos<input type="file" id="galInput" accept="image/jpeg,image/png,image/jpg" multiple></label>
      <div id="galUploadStatus" style="margin-top:10px; font-size:12.5px; color:var(--muted);"></div>
    </div>
    <div class="card">
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="btn sm ghost" id="galRefresh">${ICONS.refresh||''}Actualiser la galerie</button>
      </div>
      <div class="gallery-grid" id="galGrid"><div class="empty">Chargement…</div></div>
    </div>
  `;
  const PREFIX = 'gallery:';
  async function drawGallery(){
    const grid = document.getElementById('galGrid');
    grid.innerHTML = `<div class="empty">Chargement…</div>`;
    let keys;
    try{ const r = await window.storage.list(PREFIX, true); keys = r.keys; }
    catch(e){ grid.innerHTML = `<div class="empty">Erreur de chargement : ${e.message||e}</div>`; return; }
    if(!keys.length){ grid.innerHTML = `<div class="empty">Aucune photo pour le moment.</div>`; return; }
    keys = keys.slice().sort().reverse(); // timestamp-prefixed keys, newest first
    grid.innerHTML = keys.map(k=>`<div class="gallery-item" id="gal-${k}"><div class="gallery-skel"></div></div>`).join('');
    runThrottled(keys, async key=>{
      const el = document.getElementById('gal-'+key);
      if(!el) return;
      try{
        const r = await window.storage.get(key, true);
        const data = JSON.parse(r.value);
        const when = data.date ? fmtDate(data.date) : '';
        el.innerHTML = `
          <img src="${data.url}" alt="">
          <div class="gallery-caption">${data.by||''}${data.by&&when?' — ':''}${when}</div>
        `;
        el.querySelector('img').addEventListener('click', ()=>openPhotoViewer(key, data));
      }catch(e){ el.innerHTML = `<div class="empty" style="font-size:11px;">Erreur</div>`; }
    }, 4);
  }
  function openPhotoViewer(key, data){
    openModal(`
      <div style="max-width:80vw;">
        <img src="${data.url}" alt="" style="width:100%; max-height:65vh; object-fit:contain; border-radius:10px; display:block; background:#000;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;">
          <div style="font-size:12.5px; color:var(--muted);">${data.by?('Déposée par '+data.by+(data.date?' le '+fmtDate(data.date):'')):''}</div>
          <div class="btn-row" style="margin:0;">
            <a class="btn sm ghost" href="${data.url}" download="photo.jpg" target="_blank" rel="noopener">Télécharger</a>
            ${admin?`<button class="btn sm danger" id="galDelBtn">${ICONS.trash}Supprimer</button>`:''}
            <button class="btn sm ghost" id="galCloseBtn">Fermer</button>
          </div>
        </div>
      </div>
    `);
    document.getElementById('galCloseBtn').onclick = closeModal;
    if(admin){
      document.getElementById('galDelBtn').onclick = ()=>{
        openModal(`<h3>Supprimer cette photo ?</h3><p>Cette action est irréversible.</p>
          <div class="btn-row"><button class="btn red" id="confirmDelPhoto">Supprimer</button><button class="btn ghost" id="cancelDelPhoto">Annuler</button></div>`);
        document.getElementById('cancelDelPhoto').onclick = closeModal;
        document.getElementById('confirmDelPhoto').onclick = async ()=>{
          try{ await window.storage.delete(key, true); showToast('Photo supprimée'); }
          catch(e){ showToast('Erreur : '+(e.message||e)); }
          closeModal(); drawGallery();
        };
      };
    }
  }
  // Firestore documents are capped at ~1MB, so shrink progressively until the
  // encoded photo comfortably fits, rather than failing on a big camera photo.
  async function compressForFirestore(file){
    const attempts = [[1280,0.75], [1000,0.6], [760,0.5], [560,0.45]];
    let last;
    for(const [dim,q] of attempts){
      last = await fileToCompressedDataURL(file, dim, q);
      if(last.length < 850000) return last;
    }
    return last;
  }
  document.getElementById('galRefresh').addEventListener('click', drawGallery);
  document.getElementById('galInput').addEventListener('change', async e=>{
    const files = [...e.target.files];
    if(!files.length) return;
    const statusEl = document.getElementById('galUploadStatus');
    let done = 0;
    statusEl.textContent = `Envoi de 0/${files.length}…`;
    await runThrottled(files, async file=>{
      if(!/^image\/(jpe?g|png)$/.test(file.type)){ done++; statusEl.textContent = `Envoi de ${done}/${files.length}… (fichier ignoré : ${file.name})`; return; }
      try{
        const dataUri = await compressForFirestore(file);
        if(dataUri.length >= 900000){ done++; statusEl.textContent = `Envoi de ${done}/${files.length}… (trop grande, ignorée : ${file.name})`; return; }
        const key = PREFIX + Date.now()+'_'+uid();
        await window.storage.set(key, JSON.stringify({ url: dataUri, by: currentUserName(), date: todayISO() }), true);
      }catch(err){ console.error('upload failed for', file.name, err); }
      done++; statusEl.textContent = `Envoi de ${done}/${files.length}…`;
    }, 3);
    statusEl.textContent = `${files.length} photo(s) envoyée(s).`;
    e.target.value = '';
    drawGallery();
  });
  drawGallery();
}

// SEPA/EPC payment QR codes ("QR code bancaire européen") — a QR encoding
// plain text (IBAN, name, amount, reference) per the EPC069-12 standard.
// Any European banking app can scan it to prefill a normal bank transfer.
// No money ever passes through this app and no payment gateway/agreement is
// needed: it's the exact same standard printed on Belgian invoices.
let QR_LOAD_PROMISE = null;
function loadQrLib(){
  if(window.QRCode) return Promise.resolve();
  if(QR_LOAD_PROMISE) return QR_LOAD_PROMISE;
  QR_LOAD_PROMISE = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ QR_LOAD_PROMISE = null; reject(new Error('Impossible de charger la bibliothèque QR (vérifiez la connexion internet)')); };
    document.head.appendChild(s);
  });
  return QR_LOAD_PROMISE;
}
function buildEpcQrString({bic, nom, iban, montant, communication}){
  return [
    'BCD', '002', '1', 'SCT',
    (bic||'').replace(/\s+/g,''),
    (nom||'').slice(0,70),
    (iban||'').replace(/\s+/g,''),
    'EUR'+Number(montant||0).toFixed(2),
    '', '',
    (communication||'').slice(0,140),
  ].join('\n');
}
function bankAccountConfigured(){ const s=STATE.settings||{}; return !!(s.compteIban && s.compteTitulaire); }
async function showQrModal(montant, communication){
  const s = STATE.settings||{};
  if(!bankAccountConfigured()){
    showToast("Configurez d'abord le compte bancaire de l'internat (section ci-dessus)");
    return;
  }
  openModal(`
    <div style="text-align:center; max-width:320px;">
      <h3 style="border:none; padding:0;">QR code de paiement</h3>
      <p style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">À faire scanner avec une application bancaire — le virement est pré-rempli, à confirmer par la personne qui paie.</p>
      <div id="qrCanvasWrap" style="display:flex; justify-content:center; margin-bottom:14px;"></div>
      <div style="font-size:13px; text-align:left; background:var(--bg); border-radius:10px; padding:10px 14px;">
        <div><b>Bénéficiaire :</b> ${s.compteTitulaire||''}</div>
        <div><b>IBAN :</b> <span class="mono">${s.compteIban||''}</span></div>
        <div><b>Montant :</b> ${Number(montant||0).toFixed(2)} €</div>
        <div><b>Communication :</b> ${communication||'—'}</div>
      </div>
      <div class="btn-row" style="margin-top:16px; justify-content:center;">
        <button class="btn sm ghost" id="qrPrint">${ICONS.print}Imprimer</button>
        <button class="btn sm ghost" id="qrClose">Fermer</button>
      </div>
    </div>
  `);
  document.getElementById('qrClose').onclick = closeModal;
  try{
    await loadQrLib();
    const text = buildEpcQrString({ bic:s.compteBic, nom:s.compteTitulaire, iban:s.compteIban, montant, communication });
    new QRCode(document.getElementById('qrCanvasWrap'), { text, width:200, height:200, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById('qrPrint').onclick = ()=>{
      const img = document.querySelector('#qrCanvasWrap img, #qrCanvasWrap canvas');
      const imgSrc = img ? (img.tagName==='IMG'?img.src:img.toDataURL()) : '';
      const body = `
        <div style="text-align:center;">
          ${imgSrc?`<img src="${imgSrc}" style="width:200px; height:200px;">`:''}
          <p><b>${s.compteTitulaire||''}</b><br>${s.compteIban||''}<br>${Number(montant||0).toFixed(2)} €<br>${communication||''}</p>
        </div>`;
      openPrintWindow('QR code de paiement', body);
    };
  }catch(e){ document.getElementById('qrCanvasWrap').innerHTML = `<div class="empty">${e.message||e}</div>`; }
}

  function campagnes(){ return [...new Set(STATE.ventes.map(v=>v.campagne).filter(Boolean))].sort(); }

    STATE.ventes.push({id:uid(), campagne, vendeurId, date:document.getElementById('vDate').value, quantite, prixUnitaire, montant, paye:document.getElementById('vPaye').checked});
    persist('ventes'); showToast('Vente ajoutée'); drawAll();
    ['vQuantite','vMontant'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('vQuantite').value = '0';
  };
  document.getElementById('vPrint').onclick = ()=>{
    const rows = filteredRows();
    let totalQte=0, totalMontant=0;
    const body = `
      <table><thead><tr><th>Campagne</th><th>Date</th><th>Vendeur</th><th>Quantité</th><th>Montant</th><th>Remis</th></tr></thead>
      <tbody>${rows.map(v=>{ totalQte+=Number(v.quantite||0); totalMontant+=Number(v.montant||0);
        return `<tr><td>${v.campagne||'—'}</td><td>${fmtDate(v.date)}</td><td>${vendeurLabel(v)}</td><td>${v.quantite||0}</td><td>${Number(v.montant||0).toFixed(2)} €</td><td>${v.paye?'Oui':'Non'}</td></tr>`;
      }).join('')}</tbody></table>
      <div class="section-title">${totalQte} unité(s) — ${totalMontant.toFixed(2)} € au total</div>
    `;
    openPrintWindow('Ventes & collectes'+(activeCampagne?' — '+activeCampagne:''), body);

  drawAll();

  }

// A simple document library: Direction uploads the PDFs it already produces
// externally (horaires, réunions, gardes du dimanche, fonctions) instead of
// this app trying to reproduce that scheduling logic itself.
const PLANNING_CATEGORIES = [
  { key:'horaires', label:'Horaires éducateurs', color:'blue' },
  { key:'reunions', label:'Réunions', color:'green' },
  { key:'gardes', label:'Gardes du dimanche', color:'amber' },
  { key:'fonctions', label:'Fonction de chacun', color:'violet' },
  { key:'internes', label:'Documents internes', color:'red' },
];
function planningCatMeta(key){ return PLANNING_CATEGORIES.find(x=>x.key===key) || { label:key, color:'gray' }; }
function dataUriToBlob(dataUri){
  const [meta, b64] = dataUri.split(',');
  const mime = (meta.match(/data:(.*?);base64/)||[])[1] || 'application/pdf';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function renderPlanning(main){
  const admin = isAdmin();
  let activeCat = '';
  main.innerHTML = `
    <div class="page-head"><div class="icon-badge">${ICONS.planning}</div><div><h2>Documents de l'année</h2><p>Horaires, réunions, gardes du dimanche, fonction de chacun et documents concernant les internes — au même endroit.</p></div></div>
    ${admin?collapsible("Ajouter un document", `
      <div class="grid-form" style="margin-top:4px;">
        <div class="field"><label>Catégorie</label><select id="pdCategorie">${PLANNING_CATEGORIES.map(c=>`<option value="${c.key}">${c.label}</option>`).join('')}</select></div>
        <div class="field"><label>Titre</label><input id="pdTitre" placeholder="Ex : Horaires semaine du 1er septembre"></div>
      </div>
      <div class="field"><label>Fichier PDF (700 Ko maximum)</label><input type="file" id="pdFile" accept="application/pdf"></div>
      <div id="pdStatus" style="margin-top:8px; font-size:12.5px; color:var(--muted);"></div>
      <div class="btn-row" style="margin-top:10px;"><button class="btn sm" id="pdAdd">Ajouter le document</button></div>
    `):lockNote()}
    <div class="card">
      <div class="type-tabs" id="pdTypeTabs"></div>
      <div id="pdList" style="margin-top:10px;"></div>
    </div>
  `;
  function drawTabs(){
    const tabs = [{key:'',label:'Tous'}, ...PLANNING_CATEGORIES.map(c=>({key:c.key,label:c.label}))];
    document.getElementById('pdTypeTabs').innerHTML = tabs.map(t=>{
      const count = t.key ? STATE.documentsEquipe.filter(d=>d.categorie===t.key).length : STATE.documentsEquipe.length;
      return `<button class="type-tab ${activeCat===t.key?'active':''}" data-cat="${t.key}">${t.label} (${count})</button>`;
    }).join('');
    document.querySelectorAll('#pdTypeTabs .type-tab').forEach(b=>b.addEventListener('click',()=>{ activeCat=b.dataset.cat; drawTabs(); drawList(); }));
  }
  function drawList(){
    const rows = STATE.documentsEquipe.filter(d=>!activeCat||d.categorie===activeCat).slice().sort((a,b)=>(b.dateAjout||'').localeCompare(a.dateAjout||''));
    document.getElementById('pdList').innerHTML = rows.length? rows.map(d=>{ const cat = planningCatMeta(d.categorie); return `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding:12px 0; flex-wrap:wrap;">
        <div>
          <div><b>${d.titre}</b> <span class="badge ${cat.color}">${cat.label}</span></div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:3px;">Ajouté le ${fmtDate(d.dateAjout)} par ${d.ajoutePar||'—'}${d.tailleKo?' — '+d.tailleKo+' Ko':''}</div>
        </div>
        <div class="btn-row">
          <button class="btn sm ghost" data-view="${d.id}">Voir / Télécharger</button>
          ${admin?`<button class="btn sm danger" data-del="${d.id}">${ICONS.trash}</button>`:''}
        </div>
      </div>
    `; }).join('') : `<div class="empty">Aucun document${activeCat?' dans cette catégorie':''} pour le moment.</div>`;
    document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', async ()=>{
      const newTab = window.open('', '_blank'); // opened synchronously, right on the click, so browsers don't treat it as a popup
      const orig = b.textContent; b.disabled = true; b.textContent = 'Chargement…';
      try{
        const r = await window.storage.get('teamdoc:'+b.dataset.view, true);
        const blob = dataUriToBlob(r.value);
        const url = URL.createObjectURL(blob);
        if(newTab) newTab.location.href = url;
        else showToast('Votre navigateur a bloqué la fenêtre — autorisez les pop-ups pour ce site puis réessayez');
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
      }catch(e){ if(newTab) newTab.close(); showToast('Erreur : '+(e.message||e)); }
      b.disabled = false; b.textContent = orig;
    }));
    if(admin) document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      const d = STATE.documentsEquipe.find(x=>x.id===b.dataset.del);
      if(!d) return;
      openModal(`<h3>Supprimer « ${d.titre} » ?</h3><p>Cette action est irréversible.</p>
        <div class="btn-row"><button class="btn red" id="confirmDelDoc">Supprimer</button><button class="btn ghost" id="cancelDelDoc">Annuler</button></div>`);
      document.getElementById('cancelDelDoc').onclick = closeModal;
      document.getElementById('confirmDelDoc').onclick = async ()=>{
        await window.storage.delete('teamdoc:'+d.id, true).catch(()=>{});
        STATE.documentsEquipe = STATE.documentsEquipe.filter(x=>x.id!==d.id);
        await persist('documentsEquipe');
        closeModal(); showToast('Document supprimé'); drawTabs(); drawList();
      };
    }));
  }
  if(admin) document.getElementById('pdAdd').onclick = ()=>{
    const categorie = document.getElementById('pdCategorie').value;
    const titre = document.getElementById('pdTitre').value.trim();
    const file = document.getElementById('pdFile').files[0];
    const statusEl = document.getElementById('pdStatus');
    if(!titre || !file){ statusEl.textContent = 'Titre et fichier requis.'; return; }
    if(file.type !== 'application/pdf'){ statusEl.textContent = 'Seuls les fichiers PDF sont acceptés.'; return; }
    if(file.size > 700*1024){ statusEl.textContent = `Fichier trop volumineux (${Math.round(file.size/1024)} Ko) — 700 Ko maximum. Essayez de le compresser ou de le scinder.`; return; }
    statusEl.textContent = 'Envoi en cours…';
    const reader = new FileReader();
    reader.onload = async e=>{
      try{
        const id = uid();
        await window.storage.set('teamdoc:'+id, e.target.result, true);
        STATE.documentsEquipe.push({ id, categorie, titre, dateAjout: todayISO(), ajoutePar: currentUserName(), tailleKo: Math.round(file.size/1024) });
        await persist('documentsEquipe');
        statusEl.textContent = 'Document ajouté.';
        document.getElementById('pdTitre').value=''; document.getElementById('pdFile').value='';
        showToast('Document ajouté'); drawTabs(); drawList();
      }catch(err){ statusEl.textContent = 'Erreur : '+(err.message||err); }
    };
    reader.readAsDataURL(file);
  };
  drawTabs(); drawList();
}

  chambres: { label:'Occupation des chambres (photo de fin d\'année)', fmt:c=>`${c.nom} — ${(c.interneIds||[]).map(id=>nomComplet(getInterne(id))).join(', ')||'Vide'}` },
};
// Data retention policy: archived school years are kept for 5 years, then
// purged. Comparing plain ISO date strings (YYYY-MM-DD) works directly since
// they sort lexicographically the same as chronologically.
const ARCHIVE_RETENTION_YEARS = 5;
function archiveRetentionCutoff(){
  const d = new Date();
  d.setFullYear(d.getFullYear() - ARCHIVE_RETENTION_YEARS);
  return d.toISOString().slice(0,10);
}
function isArchiveExpired(a){ return (a.date||'') <= archiveRetentionCutoff(); }
